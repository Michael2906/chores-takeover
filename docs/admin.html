<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chore Boar Admin</title>
    <meta name="theme-color" content="#f5a33c" />
    <meta name="description" content="Every household at once." />

    <!--
      The admin app, framed so Google's header and footer do not show, with
      an icon of its own.

      It frames the FAMILY deployment with ?admin=1 rather than a second
      deployment. That is the whole reason this works now: a deployment set
      to "only myself" cannot be framed from here, because Safari hides its
      cookies from a third-party frame -- so Google demanded a sign-in and
      navigated the top window out of the frame to do it. An anonymous
      deployment frames fine, and the admin page behind ?admin=1 carries its
      own password instead. See Admin.gs.

      ?admin=1 is not a secret and not a gate. All it does is draw the
      password form.

      Unlike index.html this is NOT a token bridge: the admin session and any
      borrowed household seat are deliberately kept off this origin.
    -->
    <link rel="icon" href="https://thechoreboar.fyi/icon-admin.png" />
    <link rel="apple-touch-icon" sizes="180x180"
          href="https://thechoreboar.fyi/icon-admin-v2.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180"
          href="https://thechoreboar.fyi/icon-admin-v2.png" />
    <link rel="manifest" href="/admin.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Chore Boar Admin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- An admin console has no business in a search index. -->
    <meta name="robots" content="noindex, nofollow" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f5a33c;
        overflow: hidden;
      }
      iframe {
        display: block;
        border: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <iframe id="app"
            title="Chore Boar Admin"
            allow="clipboard-write"
            src="https://script.google.com/macros/s/AKfycbwO_tiMhOD7_LVi66_XZSDgm9bodOnso_EvB_fskJQoPkJattag_dMozAnvQi4_8nOB/exec?admin=1"></iframe>

    <noscript>
      <p style="font:16px Arial;padding:2rem;text-align:center">
        Chore Boar needs JavaScript.
      </p>
    </noscript>
  </body>
</html>
