     app serves no static files of its own. Everything below falls back to a
     system stack if the request is blocked, so the interface never depends
     on it. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"

<style>
/* ===================================================================
   Chore Boar -- all styling.

   The look is deliberately loud: ink-black rules, hard offset shadows
   with no blur, flat saturated colour, heavy type. Nothing is soft. The
   point is that a nine-year-old can tell across a kitchen which card is
   theirs and which button does the thing.

   Three rules hold it together, and everything below is an application
   of them:

     1. Every surface is outlined in ink (--bw).
     2. Every raised surface casts a SOLID shadow, offset down-right,
        never blurred (--pop).
     3. Pressing something moves it INTO its own shadow. That is the
        whole interaction language -- press, and the thing you pressed
        goes down.

   Class names are unchanged from the previous stylesheet; Scripts.html
   builds the same markup it always did.
   =================================================================== */

/* -------------------------------------------------------------------
   Tokens
   ------------------------------------------------------------------- */
:root {
  /* Fluid, with a floor that stays readable on a phone -- which is where
     this actually gets used. */
  --font-size: clamp(17px, 0.5vw + 15.5px, 19px);

  --font-ui: 'Archivo', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'Space Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;

  /* --- Palette -------------------------------------------------------
     Ink and bone carry the layout; the five brights carry meaning. They
     are used flat, never as gradients, and never two of them blended. */
  --ink: #14100e;
  --ink-soft: #554c46;
  --paper: #fffdf7;
  --bone: #f2e9d6;

  --lime: #c9f227;
  --blue: #2f6bff;

  /* The big surfaces -- the sign-in and name-list backgrounds, and the
     header. Acid lime is the right colour for a 2rem button and the wrong
     one for half a 27-inch screen: at that size it stops being an accent
     and starts being a headache. This is the same hue family, desaturated
     far enough to sit behind things all day. Lime stays for the small,
     loud, deliberate parts -- go buttons, points, done. */
  --wash: #d9e4bd;
  --coral: #ff5a4e;
  --violet: #9b6bff;
  --sun: #ffd84d;
  --mint: #26dfb8;
  --red: #e23b2e;

  /* Kept under their old names so nothing that reads a variable has to
     change. The meanings moved; the names did not. */
  --primary: var(--blue);
  --secondary: var(--coral);
  --tertiary: var(--sun);
  --quaternary: var(--lime);
  --quinary: var(--mint);
  --dark-font: var(--ink);
  --light-font: var(--paper);
  --dark-bg: var(--bone);
  --light-bg: var(--paper);
  --error: var(--red);
  --warning: var(--sun);
  --success: var(--lime);
  --info: var(--violet);
  --card: var(--paper);
  --card-sunk: var(--bone);
  --line: var(--ink);
  --muted: var(--ink-soft);
  --ghost: rgba(20, 16, 14, 0.18);

  /* --- Edges and shadows --------------------------------------------
     One border width for everything that is a surface, one for small
     things like pills. The shadows are solid colour: 0 blur, always. */
  --bw: 3px;
  --bw-sm: 2px;
  --border: var(--bw) solid var(--ink);
  --border-sm-line: var(--bw-sm) solid var(--ink);

  --pop-sm: 3px 3px 0 var(--ink);
  --pop: 5px 5px 0 var(--ink);
  --pop-lg: 8px 8px 0 var(--ink);
  --pop-xl: 12px 12px 0 var(--ink);

  /* Old names, still referenced in a few places for radii. Corners are
     square here -- the roundness lives on pills and avatars only. */
  --border-xs: 0.125rem;
  --border-sm: 0.25rem;
  --border-md: 0.5rem;
  --border-lg: 1rem;
  --border-xl: 2rem;
  --pill: 999px;

  /* Spacing */
  --spacing-xs: 0.25rem;
  --spacing-sm: 0.5rem;
  --spacing-md: 1rem;
  --spacing-lg: 2rem;
  --spacing-xl: 4rem;

  --header-h: 3.6rem;

  /* The two page textures. Both are drawn from ink at low alpha so they
     read as printing, not as a colour of their own. */
  --dots:
    radial-gradient(rgba(20, 16, 14, 0.13) 1.6px, transparent 1.7px);
  --dots-size: 22px 22px;
  --stripes: repeating-linear-gradient(
    -45deg,
    rgba(20, 16, 14, 0.055) 0 10px,
    transparent 10px 20px);
}

/* -------------------------------------------------------------------
   Base
   ------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: var(--font-size);
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-ui);
  color: var(--ink);
  background-color: var(--bone);
  background-image: var(--dots);
  background-size: var(--dots-size);
  overflow-x: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  line-height: 1.45;
}

button,
input,
select,
textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  background: none;
  border: none;
  cursor: pointer;
}

h1, h2, h3 {
  line-height: 1.05;
  font-weight: 900;
  letter-spacing: -0.02em;
}

h1 { font-size: 1.9rem; text-transform: uppercase; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }

strong, b { font-weight: 800; }

::selection { background: var(--lime); color: var(--ink); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* Violet, because it is the one bright that stands out against every
   other surface here -- lime, blue, paper and ink alike. */
:focus-visible {
  outline: 4px solid var(--violet);
  outline-offset: 3px;
}

[hidden] { display: none !important; }

/* -------------------------------------------------------------------
   Splash
   ------------------------------------------------------------------- */
.splash {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-md);
  background-color: var(--wash);
  background-image: var(--stripes);
  z-index: 50;
}

/* The mark is artwork on a white ground, so it is framed rather than
   floated: a paper panel with an ink edge, the same object as every
   other surface in here. */
.splash-mark,
.gate-mark,
.brand-mark {
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
  background-color: var(--paper);
  border: var(--border);
}

.splash-mark {
  width: 15rem; height: 8rem;
  padding: var(--spacing-sm);
  box-shadow: var(--pop-lg);
}

.gate-mark {
  width: 13rem; height: 6.9rem;
  margin: 0 auto;
  padding: var(--spacing-xs);
  box-shadow: var(--pop);
}

.brand-mark {
  width: 5.6rem; height: 2.7rem;
  flex: none;
  border-width: var(--bw-sm);
  box-shadow: var(--pop-sm);
}

.splash-text {
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink);
}

.spinner {
  width: 2rem;
  height: 2rem;
  border: 0.32rem solid var(--ink);
  border-top-color: var(--lime);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2.4s; }
  * { transition-duration: 0.01ms !important; }
}

/* -------------------------------------------------------------------
   Screens, and the panel every screen is built from
   ------------------------------------------------------------------- */
.screen { min-height: 100vh; min-height: 100dvh; }

#gate,
#picker,
#admin {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--spacing-md);
  background-color: var(--wash);
  background-image: var(--stripes);
}

.card {
  background: var(--paper);
  border: var(--border);
  box-shadow: var(--pop-xl);
  padding: var(--spacing-lg);
}

.gate-card   { width: min(26rem, 100%); }
.picker-card { width: min(42rem, 100%); }

/* -------------------------------------------------------------------
   The global admin page
   ------------------------------------------------------------------- */
.admin-card {
  width: min(56rem, 100%);
  max-height: 92vh;
  max-height: 92dvh;
  overflow-y: auto;
}

.admin-who {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  background: var(--ink);
  color: var(--paper);
  padding: 0.1rem var(--spacing-sm);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* The bar that says whose seat this is. Violet, because it is the one
   colour the board itself never uses for a chore state -- so a borrowed
   session cannot be mistaken for anything that belongs to the household. */
.admin-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-sm);
  flex-wrap: wrap;
  padding: var(--spacing-xs) var(--spacing-sm);
  background: var(--violet);
  color: var(--paper);
  border-bottom: var(--border);
  font-weight: 800;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  flex: none;
  z-index: 11;
}

.gate-tagline {
  text-align: center;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 0.82rem;
  margin: var(--spacing-md) 0;
  padding: var(--spacing-xs) 0;
  border-top: var(--border-sm-line);
  border-bottom: var(--border-sm-line);
}

/* -------------------------------------------------------------------
   Forms
   ------------------------------------------------------------------- */
.seg {
  display: flex;
  border: var(--border);
  margin-bottom: var(--spacing-md);
}

.seg-btn {
  flex: 1;
  padding: var(--spacing-sm);
  font-weight: 800;
  text-transform: uppercase;
  /* Small enough that "Create a household" stays on one line in the
     narrowest card this ever draws. */
  font-size: 0.72rem;
  letter-spacing: 0;
  background: var(--paper);
  transition: background 0.12s, color 0.12s;
}

.seg-btn + .seg-btn { border-left: var(--border); }
.seg-btn.active { background: var(--ink); color: var(--paper); }

.form { display: flex; flex-direction: column; gap: var(--spacing-md); }

.field { display: flex; flex-direction: column; gap: var(--spacing-xs); }

.field > span,
.field > label {
  font-weight: 800;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.field > small { color: var(--ink-soft); font-size: 0.78rem; }

.field input,
.field select,
.field textarea {
  padding: var(--spacing-sm);
  border: var(--border);
  background: var(--paper);
  /* 16px stops iOS Safari zooming the whole page on focus. */
  font-size: max(1rem, 16px);
  font-weight: 500;
  transition: box-shadow 0.12s;
}

/* Focus is a shadow, not a colour change: the ink edge is the same on
   every field, so the thing that moves is the one you are in. */
.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: none;
  box-shadow: var(--pop-sm);
}

.field textarea { resize: vertical; min-height: 4.5rem; }

.form-error {
  background: var(--coral);
  color: var(--ink);
  border: var(--border);
  box-shadow: var(--pop-sm);
  padding: var(--spacing-sm);
  font-size: 0.88rem;
  font-weight: 700;
}

.form-hint {
  color: var(--ink-soft);
  font-size: 0.8rem;
  line-height: 1.45;
  text-align: center;
}

/* -------------------------------------------------------------------
   Buttons

   One shape, six fills. The press is the shared part: the button slides
   down-right by exactly its shadow and the shadow goes away, so it ends
   up flat on the page.
   ------------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-sm) var(--spacing-md);
  border: var(--border);
  box-shadow: var(--pop-sm);
  background: var(--paper);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-size: 0.88rem;
  line-height: 1.1;
  text-align: center;
  min-height: 2.5rem;
  transition: transform 0.08s, box-shadow 0.08s, filter 0.12s;
}

.btn:active:not(:disabled) {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--ink);
}

.btn-block { width: 100%; }

.btn-sm {
  padding: var(--spacing-xs) var(--spacing-sm);
  min-height: 2.1rem;
  font-size: 0.74rem;
  box-shadow: var(--pop-sm);
}

.btn-primary   { background: var(--blue);  color: var(--paper); }
.btn-go        { background: var(--lime);  color: var(--ink); }
.btn-warn      { background: var(--sun);   color: var(--ink); }
.btn-danger    { background: var(--red);   color: var(--paper); }
.btn-secondary { background: var(--paper); color: var(--ink); }

/* The one button with no box. It is for "actually, take me back", and it
   should never compete with a real action. */
.btn-quiet {
  background: none;
  border: none;
  box-shadow: none;
  color: var(--ink-soft);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-transform: none;
  font-weight: 600;
  letter-spacing: 0;
  min-height: auto;
  padding: var(--spacing-xs);
}

.btn-quiet:active:not(:disabled) { transform: none; }

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none;
  transform: translate(3px, 3px);
}

/* -------------------------------------------------------------------
   Name picker
   ------------------------------------------------------------------- */
.picker-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--spacing-sm);
  margin-bottom: var(--spacing-md);
  padding-bottom: var(--spacing-sm);
  border-bottom: var(--border);
  flex-wrap: wrap;
}

.member-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
  gap: var(--spacing-md);
}

.member-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-md) var(--spacing-sm);
  background: var(--paper);
  border: var(--border);
  box-shadow: var(--pop);
  transition: transform 0.1s, box-shadow 0.1s;
}

.member-tile:active {
  transform: translate(5px, 5px);
  box-shadow: 0 0 0 var(--ink);
}

.avatar {
  width: 3.8rem;
  height: 3.8rem;
  border-radius: 50%;
  border: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--paper);
  font-size: 1.5rem;
  font-weight: 900;
  /* Same reason as .pill.who -- the fill is a stored colour. */
  text-shadow: 0 0 4px var(--ink);
  flex: none;
}

.member-tile .name {
  font-weight: 900;
  text-align: center;
  word-break: break-word;
  line-height: 1.15;
}

.member-tile .role {
  font-size: 0.66rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  background: var(--ink);
  color: var(--paper);
  padding: 0 var(--spacing-xs);
}

.member-tile .lock { font-size: 0.7rem; color: var(--ink-soft); font-weight: 700; }

/* PIN pad */
.pin-dots {
  display: flex;
  justify-content: center;
  gap: var(--spacing-sm);
  margin: var(--spacing-md) 0;
}

.pin-dot {
  width: 1rem;
  height: 1rem;
  border: var(--border-sm-line);
  background: var(--paper);
}

.pin-dot.filled { background: var(--blue); }

.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--spacing-sm);
  max-width: 17rem;
  margin: 0 auto;
}

.pin-key {
  padding: var(--spacing-md);
  background: var(--paper);
  border: var(--border);
  box-shadow: var(--pop-sm);
  font-family: var(--font-mono);
  font-size: 1.3rem;
  font-weight: 700;
  min-height: 3.1rem;
  transition: transform 0.07s, box-shadow 0.07s;
}

.pin-key.wide { grid-column: span 1; font-size: 0.85rem; font-family: var(--font-ui);
                font-weight: 800; text-transform: uppercase; }

.pin-key:active {
  background: var(--lime);
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--ink);
}

/* -------------------------------------------------------------------
   The board's own chrome -- header / tabs / content
   ------------------------------------------------------------------- */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

#header {
  /* Three columns, so the household name centres against the HEADER and
     not against the space left over beside the account chip. */
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: var(--spacing-sm);
  height: var(--header-h);
  padding: 0 var(--spacing-sm);
  background: var(--wash);
  border-bottom: var(--border);
  flex: none;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  min-width: 0;
  justify-self: start;
}

.brand-household {
  grid-column: 2;
  justify-self: center;
  background: var(--ink);
  color: var(--paper);
  font-weight: 900;
  font-size: 0.86rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0.15rem var(--spacing-sm);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

#account-info { position: relative; justify-self: end; }

.chip {
  display: flex;
  align-items: center;
  gap: var(--spacing-xs);
  padding: 0.2rem var(--spacing-xs) 0.2rem 0.2rem;
  background: var(--paper);
  border: var(--border-sm-line);
  box-shadow: var(--pop-sm);
  font-weight: 800;
  max-width: 12rem;
  transition: transform 0.08s, box-shadow 0.08s;
}

.chip:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }

.chip-dot {
  width: 1.5rem; height: 1.5rem;
  border-radius: 50%;
  border: var(--border-sm-line);
  flex: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--paper);
  font-size: 0.72rem;
  font-weight: 900;
  text-shadow: 0 0 3px var(--ink);
}

.chip-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 0.85rem;
}

.chip-points {
  background: var(--sun);
  color: var(--ink);
  border: var(--border-sm-line);
  padding: 0 var(--spacing-xs);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 0.72rem;
  flex: none;
}

.menu {
  position: absolute;
  right: 0;
  top: calc(100% + var(--spacing-sm));
  background: var(--paper);
  border: var(--border);
  box-shadow: var(--pop-lg);
  z-index: 20;
  min-width: 13rem;
}

.menu-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: var(--spacing-sm) var(--spacing-md);
  white-space: nowrap;
  font-weight: 700;
  font-size: 0.88rem;
}

.menu-item + .menu-item { border-top: var(--border-sm-line); }
.menu-item.danger { color: var(--red); }

/* --- Tabs ---------------------------------------------------------- */
#tabs {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  background: var(--paper);
  border-bottom: var(--border);
  padding: var(--spacing-sm);
  flex: none;
}

.tab-strip {
  display: flex;
  align-items: stretch;
  gap: var(--spacing-sm);
  min-width: 0;
  flex: 1;
  flex-wrap: wrap;
}

.tab {
  position: relative;
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-xs) var(--spacing-sm);
  background: var(--bone);
  color: var(--ink);
  border: var(--border-sm-line);
  box-shadow: var(--pop-sm);
  white-space: nowrap;
  font-weight: 800;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  transition: transform 0.08s, box-shadow 0.08s, background 0.12s, color 0.12s;
}

.tab.active {
  background: var(--blue);
  color: var(--paper);
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--ink);
}

.tab-count {
  display: none;
  background: var(--ink);
  color: var(--paper);
  border-radius: var(--pill);
  padding: 0 0.4rem;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 700;
}

.tab-count.show { display: inline-block; }
.tab-count.alert { background: var(--coral); color: var(--ink); }
.tab.active .tab-count { background: var(--paper); color: var(--ink); }
.tab.active .tab-count.alert { background: var(--sun); }

/* The condensed control that replaces the strip on a narrow screen. */
#tab-menu { display: none; position: relative; flex: 1; min-width: 0; }

#tab-menu-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-sm);
  width: 100%;
  padding: var(--spacing-sm);
  background: var(--blue);
  color: var(--paper);
  border: var(--border);
  box-shadow: var(--pop-sm);
  font-weight: 800;
  text-transform: uppercase;
  font-size: 0.8rem;
  min-height: 2.5rem;
}

#tab-menu-btn .caret { font-size: 0.65em; }

#tab-menu-list {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + var(--spacing-sm));
  background: var(--paper);
  border: var(--border);
  box-shadow: var(--pop-lg);
  z-index: 25;
}

#tab-menu-list button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-sm);
  width: 100%;
  text-align: left;
  padding: var(--spacing-sm) var(--spacing-md);
  color: var(--ink);
  font-weight: 800;
  text-transform: uppercase;
  font-size: 0.8rem;
}

#tab-menu-list button + button { border-top: var(--border-sm-line); }
#tab-menu-list button.on { background: var(--blue); color: var(--paper); }

#tab-menu-list .n {
  background: var(--ink);
  color: var(--paper);
  border-radius: var(--pill);
  padding: 0 0.45rem;
  font-family: var(--font-mono);
  font-size: 0.72rem;
}

#tab-menu-list button.on .n { background: var(--paper); color: var(--ink); }

/* --- Search -------------------------------------------------------- */
#search { position: relative; flex: none; display: flex; }

#search-box {
  width: 12rem;
  padding: var(--spacing-xs) 2.6rem var(--spacing-xs) var(--spacing-sm);
  border: var(--border-sm-line);
  background: var(--paper);
  font-size: max(0.9rem, 16px);
  font-weight: 500;
  transition: box-shadow 0.12s;
}

#search-box:focus { outline: none; box-shadow: var(--pop-sm); }

#search-clear {
  position: absolute;
  top: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--ink);
  color: var(--paper);
  height: 100%;
  aspect-ratio: 1;
  font-size: 1.1rem;
  line-height: 1;
}

#search-clear:active { background: var(--coral); color: var(--ink); }

/* --- Content ------------------------------------------------------- */
#content-field {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background-color: var(--bone);
  background-image: var(--dots);
  background-size: var(--dots-size);
  padding: var(--spacing-md);
  /* Room for the floating add button and the phone's home bar. */
  padding-bottom: calc(6rem + env(safe-area-inset-bottom, 0px));
}

.chore-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr));
  gap: var(--spacing-md);
  align-content: start;
}

/* -------------------------------------------------------------------
   Chore cards

   The status is a fat colour bar down the left edge, drawn inside the
   card rather than as its border, so every card keeps the same ink
   outline and only the colour changes.
   ------------------------------------------------------------------- */
.chore {
  --status: var(--ink-soft);
  position: relative;
  background: var(--paper);
  border: var(--border);
  box-shadow: var(--pop);
  padding: var(--spacing-md);
  padding-left: calc(var(--spacing-md) + 0.85rem);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
  transition: transform 0.1s, box-shadow 0.1s;
}

.chore::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0.85rem;
  background: var(--status);
  border-right: var(--border);
}

.chore.s-pool        { --status: var(--blue); }
.chore.s-claimed     { --status: var(--sun); }
.chore.s-in_progress { --status: var(--mint); }
.chore.s-submitted   { --status: var(--violet); }
.chore.s-done        { --status: var(--lime); }
.chore.overdue       { --status: var(--coral); }

/* Finished work stays legible but stops shouting: it drops flat onto
   the page instead of standing proud of it. */
.chore.s-done { box-shadow: var(--pop-sm); background: #faf7ee; }

.chore-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-sm);
}

.chore-title {
  font-size: 1.05rem;
  font-weight: 900;
  line-height: 1.15;
  letter-spacing: -0.01em;
  word-break: break-word;
}

/* A sticker, slapped on slightly crooked. */
.chore-points {
  flex: none;
  background: var(--lime);
  color: var(--ink);
  border: var(--border-sm-line);
  border-radius: var(--pill);
  padding: 0.05rem var(--spacing-sm);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 700;
  white-space: nowrap;
  transform: rotate(-3deg);
}

.chore-notes {
  color: var(--ink-soft);
  font-size: 0.9rem;
  line-height: 1.4;
  word-break: break-word;
}

.chore-meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-xs);
  font-size: 0.72rem;
}

.pill {
  background: var(--paper);
  color: var(--ink);
  border: var(--border-sm-line);
  border-radius: var(--pill);
  padding: 0 var(--spacing-sm);
  white-space: nowrap;
  font-weight: 700;
}

/* .who carries an inline background -- whoever's colour it is. The
   palette in memberColor() is all dark enough for white text, but a
   household created before that palette landed can still be holding a
   pale colour, so the label is rung in ink rather than trusting the
   fill underneath it. */
.pill.who { color: var(--paper); text-shadow: 0 0 3px var(--ink), 0 1px 0 var(--ink); }
.pill.due  { background: var(--paper); }
.pill.late { background: var(--coral); font-weight: 800; text-transform: uppercase; }
.pill.rep  { background: var(--violet); color: var(--paper); }
.pill.src  { background: var(--sun); font-weight: 800; }

/* The reference number. Quiet -- it is for pointing at, not for reading. */
.chore-ref {
  color: var(--ink-soft);
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: 0.75em;
}

.chore-note-back {
  background: var(--sun);
  border: var(--border-sm-line);
  padding: var(--spacing-sm);
  font-size: 0.85rem;
  font-weight: 600;
}

.chore-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-sm);
  margin-top: auto;
  padding-top: var(--spacing-xs);
}

/* -------------------------------------------------------------------
   Empty states
   ------------------------------------------------------------------- */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--ink);
  padding: var(--spacing-lg) var(--spacing-md);
  margin: var(--spacing-md) auto;
  max-width: 28rem;
  border: 4px dashed var(--ink);
}

.empty h2 {
  margin-bottom: var(--spacing-sm);
  text-transform: uppercase;
  font-size: 1.35rem;
}

.empty p { color: var(--ink-soft); font-weight: 600; }

/* -------------------------------------------------------------------
   Floating add button
   ------------------------------------------------------------------- */
.fab {
  position: fixed;
  right: var(--spacing-md);
  bottom: calc(var(--spacing-md) + env(safe-area-inset-bottom, 0px));
  width: 3.6rem;
  height: 3.6rem;
  border-radius: 50%;
  background: var(--coral);
  color: var(--ink);
  border: var(--border);
  box-shadow: var(--pop);
  font-size: 2rem;
  font-weight: 900;
  line-height: 1;
  z-index: 15;
  transition: transform 0.1s, box-shadow 0.1s;
}

.fab:active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--ink); }

/* -------------------------------------------------------------------
   Modals
   ------------------------------------------------------------------- */
.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 16, 14, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--spacing-md);
  z-index: 40;
}

.modal {
  background: var(--paper);
  border: var(--bw) solid var(--ink);
  box-shadow: var(--pop-xl);
  width: min(31rem, 100%);
  max-height: 90vh;
  max-height: 90dvh;
  overflow-y: auto;
  padding: var(--spacing-lg);

  /* Scroll without the bar. A gutter appearing inside the dialog shifts
     the contents sideways as it arrives, which reads as a fault. It
     still scrolls by wheel, drag and keyboard. */
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.modal::-webkit-scrollbar { width: 0; height: 0; display: none; }

.modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-sm);
  margin-bottom: var(--spacing-md);
  padding-bottom: var(--spacing-sm);
  border-bottom: var(--border);
}

.modal-head h2 { text-transform: uppercase; font-size: 1.3rem; }

.modal-close {
  font-size: 1.2rem;
  line-height: 1;
  font-weight: 900;
  color: var(--ink);
  border: var(--border-sm-line);
  background: var(--paper);
  width: 1.9rem;
  height: 1.9rem;
  flex: none;
}

.modal-close:active { background: var(--coral); }

.modal-actions {
  display: flex;
  gap: var(--spacing-sm);
  justify-content: flex-end;
  margin-top: var(--spacing-lg);
  flex-wrap: wrap;
}

.chips { display: flex; flex-wrap: wrap; gap: var(--spacing-xs); }

.chip-pick {
  padding: var(--spacing-xs) var(--spacing-sm);
  background: var(--paper);
  border: var(--border-sm-line);
  border-radius: var(--pill);
  font-size: 0.82rem;
  font-weight: 700;
}

.chip-pick.on { background: var(--blue); color: var(--paper); }

/* Manage-accounts rows */
.roster { display: flex; flex-direction: column; gap: var(--spacing-sm); }

.roster-row {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-sm);
  background: var(--paper);
  border: var(--border-sm-line);
  flex-wrap: wrap;
}

.roster-row .who { flex: 1; min-width: 6rem; font-weight: 900; }
.roster-row .sub { font-size: 0.75rem; color: var(--ink-soft); font-weight: 600; }

/* -------------------------------------------------------------------
   Busy states

   Everything here answers the same question: "did my tap do anything?"
   Without an answer people tap again, and a second tap on Claim or
   Approve is a real request the server has to refuse.
   ------------------------------------------------------------------- */

/* A bar across the top of the WINDOW whenever any call is in flight. Fixed,
   not absolute: it lives outside the three screens so that it also covers the
   name list and the sign-in form. */
.progress {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 6px;
  background: var(--ink);
  overflow: hidden;
  z-index: 30;
}

.progress { z-index: 70; }

.progress span {
  display: block;
  height: 100%;
  width: 35%;
  background: var(--lime);
  /* Indeterminate: we cannot know how long Apps Script will take, so it
     sweeps rather than pretending to measure. */
  animation: sweep 1.1s ease-in-out infinite;
}

@keyframes sweep {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

/* A button waiting on its own request. The spinner replaces the label
   rather than sitting beside it, so the button keeps its width and does
   not shove the rest of the row about. */
.btn.is-busy {
  position: relative;
  color: transparent !important;
  pointer-events: none;
}

.btn.is-busy::after {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: 1em; height: 1em;
  margin: -0.5em 0 0 -0.5em;
  border: 2px solid rgba(20, 16, 14, 0.25);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

/* The two dark fills need a light spinner instead. */
.btn-primary.is-busy::after,
.btn-danger.is-busy::after {
  border-color: rgba(255, 253, 247, 0.4);
  border-top-color: var(--paper);
}

/* A whole card mid-action: flattened, and nothing on it can be clicked
   twice. */
.chore.is-busy {
  opacity: 0.55;
  pointer-events: none;
  transform: translate(5px, 5px);
  box-shadow: 0 0 0 var(--ink);
}

/* Picking a name is two round trips -- the pick, then the whole board -- and
   on a cold Apps Script container that is seconds with nothing on screen. The
   tile that was tapped spins; the rest of the grid goes quiet so nobody
   starts a second one underneath it. */
.member-grid.is-waiting { pointer-events: none; }
.member-grid.is-waiting .member-tile:not(.is-busy) { opacity: 0.4; }

.member-tile.is-busy { position: relative; }

.member-tile.is-busy::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 253, 247, 0.72);
  z-index: 1;
}

.member-tile.is-busy::before {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  width: 2rem; height: 2rem;
  margin: -1rem 0 0 -1rem;
  border: 0.28rem solid var(--ink);
  border-top-color: var(--lime);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  z-index: 2;
}

/* Same problem on the PIN pad: OK has a password hash and a board load
   behind it, and an unresponsive OK key is what makes somebody press it
   four more times. */
.pin-pad.is-checking { pointer-events: none; opacity: 0.5; }
.pin-key.is-busy { background: var(--lime); }

.pin-dots.is-checking::after {
  content: "";
  width: 1.1rem;
  height: 1.1rem;
  border: 0.2rem solid var(--ink);
  border-top-color: var(--lime);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-left: var(--spacing-xs);
}

/* Covers the board while a big rebuild lands (filling the trough). */
.working {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-sm);
  background: rgba(242, 233, 214, 0.82);
  z-index: 28;
  color: var(--ink);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* -------------------------------------------------------------------
   The Trough and The Prize Pen
   ------------------------------------------------------------------- */
.list-rows { display: flex; flex-direction: column; gap: var(--spacing-sm); }

.list-row {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-sm);
  background: var(--paper);
  border: var(--border-sm-line);
  flex-wrap: wrap;
}

/* A column, not a run of <br>s. The rows carry a title, a sub-line and two
   little tags, and on a phone the old inline version left the buttons
   stranded on a line of their own with a gap above them. */
.list-row .grow {
  flex: 1 1 10rem;
  min-width: 7rem;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}

.list-row .t { font-weight: 800; line-height: 1.2; }
.list-row .sub { font-size: 0.78rem; color: var(--ink-soft); font-weight: 600; }

/* Who an item is aimed at, and when it comes round. */
.row-tags {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-xs);
  margin-top: 0.15rem;
}

.row-tag {
  background: var(--bone);
  border: 1px solid var(--ink);
  border-radius: var(--pill);
  padding: 0 0.45rem;
  font-size: 0.66rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  white-space: nowrap;
}

/* Edit and Remove travel together, so a narrow row wraps them as a pair
   rather than dropping one of them onto its own line. */
.row-acts {
  display: flex;
  align-items: center;
  gap: var(--spacing-xs);
  flex: none;
}

.cost {
  background: var(--sun);
  color: var(--ink);
  border: var(--border-sm-line);
  border-radius: var(--pill);
  padding: 0 var(--spacing-sm);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 0.82rem;
  white-space: nowrap;
}

.prize { align-items: flex-start; }
.prize.cant { opacity: 0.55; }

.sold-out {
  background: var(--ink);
  color: var(--paper);
  border-radius: var(--pill);
  padding: 0 var(--spacing-sm);
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
}

.claim-status {
  border: var(--border-sm-line);
  border-radius: var(--pill);
  padding: 0 var(--spacing-sm);
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  white-space: nowrap;
}

.claim-status.claimed   { background: var(--sun);  color: var(--ink); }
.claim-status.handed    { background: var(--lime); color: var(--ink); }
.claim-status.cancelled { background: var(--bone); color: var(--ink-soft); }

/* The "who got what" summary after a fill. */
.fill-summary {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-xs);
  margin-top: var(--spacing-sm);
}

.fill-chip {
  display: flex;
  align-items: center;
  gap: var(--spacing-xs);
  background: var(--paper);
  border: var(--border-sm-line);
  border-radius: var(--pill);
  padding: 0.1rem var(--spacing-sm);
  font-size: 0.8rem;
  font-weight: 700;
}

.fill-chip .dot {
  width: 0.75rem; height: 0.75rem;
  border-radius: 50%;
  border: 1px solid var(--ink);
  flex: none;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--spacing-sm);
  margin: var(--spacing-lg) 0 var(--spacing-sm);
  padding-bottom: var(--spacing-xs);
  border-bottom: var(--border-sm-line);
  flex-wrap: wrap;
}

.section-head h3 {
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.hr {
  border: none;
  border-top: var(--border);
  margin: var(--spacing-md) 0;
}

/* -------------------------------------------------------------------
   Toast
   ------------------------------------------------------------------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--spacing-lg) + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--paper);
  border: var(--border);
  box-shadow: 5px 5px 0 var(--lime);
  padding: var(--spacing-sm) var(--spacing-md);
  font-weight: 800;
  z-index: 60;
  max-width: calc(100vw - 2rem);
  text-align: center;
}

.toast.good { background: var(--lime); color: var(--ink); box-shadow: var(--pop); }
.toast.bad  { background: var(--red);  color: var(--paper); box-shadow: var(--pop); }

/* -------------------------------------------------------------------
   The ready-made-list combobox
   -------------------------------------------------------------------
   Replaces <input list> + <datalist>. Mobile Safari draws no dropdown
   for a datalist at all and the Android browsers that do are
   inconsistent, so on a phone the ready-made chores were simply
   invisible. Built out of ordinary DOM instead, so every browser shows
   the same thing.

   The panel is IN FLOW, not absolutely positioned. The modal is a scroll
   container, so a floating panel is clipped at its edge; in flow it
   pushes the form down and the modal scrolls to it. It carries its own
   max-height so a 147-item list cannot run off the screen.
   ------------------------------------------------------------------- */
.combo { display: flex; flex-direction: column; gap: var(--spacing-xs); }

.combo-bar { display: flex; gap: var(--spacing-xs); align-items: stretch; }
.combo-bar input { flex: 1 1 auto; min-width: 0; }

.combo-toggle {
  flex: 0 0 auto;
  width: 3rem;
  border: var(--border);
  background: var(--paper);
  color: var(--ink);
  font-size: 0.75rem;
  font-weight: 800;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.combo-toggle:focus-visible { outline-offset: -1px; }
.combo.open .combo-toggle { background: var(--blue); color: var(--paper); }
.combo.open .combo-toggle .combo-chev { transform: rotate(180deg); }
.combo-chev { transition: transform 0.15s ease; }

.combo-panel {
  max-height: 15rem;
  overflow-y: auto;
  /* Never sideways -- a long title wraps instead. */
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  border: var(--border);
  background: var(--paper);
}

.combo-opt {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--spacing-sm);
  width: 100%;
  text-align: left;
  padding: var(--spacing-sm);
  background: none;
  border: none;
  border-bottom: var(--border-sm-line);
  /* A comfortable thumb target -- this is mostly used on a tablet. */
  min-height: 2.75rem;
  font-size: max(0.95rem, 15px);
  font-weight: 600;
}

.combo-opt:last-child { border-bottom: none; }
.combo-opt[hidden] { display: none; }

/* min-width lets the title shrink and wrap: a flex item otherwise
   refuses to go below its longest word, which on a narrow screen shoves
   the points and category off the edge of the row. */
.combo-label { flex: 1 1 auto; min-width: 0; overflow-wrap: break-word; }

.combo-meta {
  flex: 0 0 auto;
  color: var(--ink-soft);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  white-space: nowrap;
}

/* Keyboard cursor and touch feedback share one look, so arrowing down
   and tapping are visibly the same act. */
.combo-opt.here,
.combo-opt:active { background: var(--lime); }
.combo-opt.here { box-shadow: inset 0.35rem 0 0 var(--ink); }

/* -------------------------------------------------------------------
   Hover -- pointer devices only, so a tap does not leave a stuck state.
   The shared idea: a hovered thing lifts AWAY from its shadow, which is
   the exact opposite of pressing it.
   ------------------------------------------------------------------- */
@media (hover: hover) and (pointer: fine) {
  .btn:not(:disabled):hover,
  .chip:hover,
  .pin-key:hover {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 var(--ink);
  }

  .btn-quiet:hover { transform: none; box-shadow: none; color: var(--ink); }

  .member-tile:hover {
    transform: translate(-3px, -3px);
    box-shadow: var(--pop-lg);
  }

  .chore:hover {
    transform: translate(-2px, -2px);
    box-shadow: var(--pop-lg);
  }

  .chore.s-done:hover { box-shadow: var(--pop); }

  .tab:not(.active):hover {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--ink);
    background: var(--paper);
  }

  .fab:hover {
    transform: translate(-2px, -2px) rotate(90deg);
    box-shadow: var(--pop-lg);
  }

  .menu-item:hover,
  #tab-menu-list button:not(.on):hover,
  .combo-opt:hover { background: var(--lime); }

  .seg-btn:not(.active):hover { background: var(--bone); }
  .modal-close:hover { background: var(--coral); }
  .chip-pick:not(.on):hover { background: var(--bone); }
  #search-clear:hover { background: var(--coral); color: var(--ink); }
}

/* -------------------------------------------------------------------
   Responsive
   ------------------------------------------------------------------- */

/* Narrow: the five tabs become one dropdown, sharing a row with the
   search box. Five tabs plus a search field never fit a phone, and a
   scrolling strip hides whichever tabs are off-screen -- a dropdown
   shows all five and their counts at once. */
@media (max-width: 860px) {
  .tab-strip { display: none; }
  #tab-menu { display: block; }

  #search { flex: 1; min-width: 0; }
  #search-box { width: 100%; }
}

/* Phone */
@media (max-width: 480px) {
  :root {
    --header-h: 3.2rem;
    --bw: 2.5px;
    --pop: 4px 4px 0 var(--ink);
    --pop-lg: 6px 6px 0 var(--ink);
    --pop-xl: 7px 7px 0 var(--ink);
