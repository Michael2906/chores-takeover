<style>
/* ===================================================================
   Chore Boar -- all styling.
   An Apps Script web app serves no static files, so the CSS lives here
   rather than in /CSS. The sections below are the old files, in order:
   utilities, base, styles, hover, responsive.
   =================================================================== */

/* -------------------------------------------------------------------
   utilities -- design tokens
   ------------------------------------------------------------------- */
:root {
  /* Type.
     Fluid instead of JS-driven. The old build set --font-size from
     window.innerWidth / 128 in a resize handler, which meant the first
     paint always used the hard-coded 24px and then jumped, and which on a
     375px phone would have computed 2.9px. clamp() does the same job with
     no flash and a floor that stays readable.

     The floor is 17px, not 15px: at 15 the whole interface read as cramped
     on a phone, which is where this actually gets used. */
  --font-size: clamp(17px, 0.5vw + 15.5px, 19px);

  /* Colour palette.

     Toned down from the first pass, which put saturated teal, strong blue and
     mid-grey against each other all at once and was tiring to look at. Same
     hues, much lower saturation, and the greys warmed slightly so white cards
     sit on them without the blue-cast glare. */
  --primary: #2f5d8a;      /* was #02407d -- softer, less inky */
  --secondary: #9c6259;    /* was #914a42 */
  --tertiary: #c2ab72;     /* was #bba255 */
  --quaternary: #7fc9bd;   /* was #2ecfb4 -- the loud one; now a soft sage-teal */
  --quinary: #b7dcae;
  --ghost: #8a8a8a3d;
  --dark-font: #2f3336;
  --light-font: #eef1f2;
  --dark-bg: #7e8a90;      /* was #545454 -- lighter, so cards do not glare */
  --light-bg: #f4f6f7;
  --error: #b4544b;
  --warning: #d8a24a;
  --success: #5c9268;
  --info: #7a6a99;

  /* Surfaces derived from the palette above */
  --card: #ffffff;
  --card-sunk: #f0f2f3;
  --line: #dde1e3;
  --muted: #6d767b;

  /* Edge dimensions */
  --border-xs: 0.125rem;
  --border-sm: 0.25rem;
  --border-md: 0.5rem;
  --border-lg: 1rem;
  --border-xl: 2rem;

  /* Spacing */
  --spacing-xs: 0.25rem;
  --spacing-sm: 0.5rem;
  --spacing-md: 1rem;
  --spacing-lg: 2rem;
  --spacing-xl: 4rem;

  /* Chrome heights, referenced by the layout below */
  --header-h: 3.2rem;
}

/* -------------------------------------------------------------------
   base
   ------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  /* Set on the root only, not on `*`. Putting font-size on the universal
     selector flattens every heading and small to one size and makes rem
     resolve against a moving target. */
  font-size: var(--font-size);
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: var(--dark-font);
  background-color: var(--dark-bg);
  overflow-x: hidden;
  /* dvh tracks the real viewport as mobile browser chrome slides away; vh
     first so anything without dvh support still gets a height. */
  min-height: 100vh;
  min-height: 100dvh;
}

button,
input,
select,
textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  background: none;
  border: none;
  cursor: pointer;
}

h1, h2, h3 { line-height: 1.25; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

:focus-visible {
  outline: 3px solid var(--quaternary);
  outline-offset: 2px;
}

[hidden] { display: none !important; }

/* -------------------------------------------------------------------
   Splash
   ------------------------------------------------------------------- */
.splash {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-md);
  background: var(--dark-bg);
  z-index: 50;
}

.splash-mark,
.gate-mark,
.brand-mark {
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
}

.splash-mark { width: 14rem; height: 7.4rem; }
.gate-mark   { width: 12rem; height: 6.3rem; margin: 0 auto; }
.brand-mark  { width: 5.4rem; height: 2.85rem; flex: none; }

.splash-text { color: var(--light-font); }

.spinner {
  width: 1.8rem;
  height: 1.8rem;
  border: 0.22rem solid rgba(255, 255, 255, 0.25);
  border-top-color: var(--quaternary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2.4s; }
  * { transition-duration: 0.01ms !important; }
}

/* -------------------------------------------------------------------
   Screens shared shell
   ------------------------------------------------------------------- */
.screen { min-height: 100vh; min-height: 100dvh; }

#gate,
#picker {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--spacing-md);
}

.card {
  background: var(--card);
  border-radius: var(--border-lg);
  box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.35);
  padding: var(--spacing-lg);
}

.gate-card   { width: min(26rem, 100%); }
.picker-card { width: min(40rem, 100%); }

.gate-tagline {
  text-align: center;
  color: var(--muted);
  margin-bottom: var(--spacing-md);
}

/* -------------------------------------------------------------------
   Forms
   ------------------------------------------------------------------- */
.seg {
  display: flex;
  background: var(--card-sunk);
  border-radius: var(--border-md);
  padding: var(--border-xs);
  margin-bottom: var(--spacing-md);
}

.seg-btn {
  flex: 1;
  padding: var(--spacing-sm);
  border-radius: var(--border-sm);
  color: var(--muted);
  transition: background 0.2s, color 0.2s;
}

.seg-btn.active {
  background: var(--card);
  color: var(--primary);
  font-weight: bold;
  box-shadow: 0 0.1rem 0.3rem var(--ghost);
}

.form { display: flex; flex-direction: column; gap: var(--spacing-md); }

.field { display: flex; flex-direction: column; gap: var(--spacing-xs); }
.field > span { font-weight: bold; font-size: 0.9rem; }
.field > small { color: var(--muted); font-size: 0.8rem; }

.field input,
.field select,
.field textarea {
  padding: var(--spacing-sm);
  border: 2px solid var(--line);
  border-radius: var(--border-md);
  background: var(--card);
  /* 16px stops iOS Safari zooming the whole page on focus. */
  font-size: max(1rem, 16px);
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--primary);
  outline: none;
}

.field textarea { resize: vertical; min-height: 4.5rem; }

.form-error {
  color: var(--error);
  background: #fdecea;
  border-left: var(--border-sm) solid var(--error);
  padding: var(--spacing-sm);
  border-radius: var(--border-sm);
  font-size: 0.9rem;
}

.form-hint {
  color: var(--muted);
  font-size: 0.82rem;
  line-height: 1.45;
  text-align: center;
}

/* -------------------------------------------------------------------
   Buttons
   ------------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-sm) var(--spacing-md);
  border-radius: var(--border-md);
  font-weight: bold;
  /* A comfortable thumb target on a phone. */
  min-height: 2.4rem;
  transition: filter 0.15s, opacity 0.15s;
}

.btn-block { width: 100%; }
.btn-sm { padding: var(--spacing-xs) var(--spacing-sm); min-height: 1.9rem;
          font-size: 0.85rem; }

.btn-primary   { background: var(--primary);   color: #fff; }
.btn-go        { background: var(--success);   color: #fff; }
.btn-warn      { background: var(--secondary); color: #fff; }
.btn-danger    { background: var(--error);     color: #fff; }
.btn-secondary { background: var(--card-sunk); color: var(--dark-font);
                 box-shadow: inset 0 0 0 2px var(--line); }
.btn-quiet     { background: none; color: var(--muted);
                 text-decoration: underline; font-weight: normal; }

.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* -------------------------------------------------------------------
   Name picker
   ------------------------------------------------------------------- */
.picker-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--spacing-sm);
  margin-bottom: var(--spacing-md);
  flex-wrap: wrap;
}

.member-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
  gap: var(--spacing-md);
}

.member-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-md) var(--spacing-sm);
  border-radius: var(--border-lg);
  background: var(--card-sunk);
  transition: transform 0.15s, box-shadow 0.15s;
}

.member-tile:active { transform: scale(0.97); }

.avatar {
  width: 3.6rem;
  height: 3.6rem;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1.5rem;
  font-weight: bold;
}

.member-tile .name { font-weight: bold; text-align: center; word-break: break-word; }
.member-tile .role { font-size: 0.75rem; color: var(--muted); }
.member-tile .lock { font-size: 0.75rem; color: var(--muted); }

/* PIN pad */
.pin-dots {
  display: flex;
  justify-content: center;
  gap: var(--spacing-sm);
  margin: var(--spacing-md) 0;
}

.pin-dot {
  width: 0.9rem;
  height: 0.9rem;
  border-radius: 50%;
  background: var(--card-sunk);
  box-shadow: inset 0 0 0 2px var(--line);
}

.pin-dot.filled { background: var(--primary); box-shadow: none; }

.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--spacing-sm);
  max-width: 16rem;
  margin: 0 auto;
}

.pin-key {
  padding: var(--spacing-md);
  border-radius: var(--border-md);
  background: var(--card-sunk);
  font-size: 1.3rem;
  font-weight: bold;
  min-height: 3rem;
}

.pin-key.wide { grid-column: span 1; font-size: 1rem; }
.pin-key:active { background: var(--line); }

/* -------------------------------------------------------------------
   styles -- the board's own chrome (header / tabs / content)
   ------------------------------------------------------------------- */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

#header {
  /* Three columns, with the middle one centred in the HEADER rather than in
     the space left over. A flex row would push the name off-centre by however
     much wider the account chip is than the logo, which is what made it look
     wrong hugging the left. */
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: var(--spacing-sm);
  height: var(--header-h);
  padding: 0 var(--spacing-sm);
  background-color: var(--quaternary);
  flex: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  min-width: 0;
  justify-self: start;
}

.brand-household {
  grid-column: 2;
  justify-self: center;
  font-weight: bold;
  font-size: 1.05rem;
  color: #23443f;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

#account-info { position: relative; justify-self: end; }

.chip {
  display: flex;
  align-items: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-xs) var(--spacing-sm);
  background: rgba(255, 255, 255, 0.85);
  border-radius: var(--border-lg);
  font-weight: bold;
  max-width: 11rem;
}

.chip-dot {
  width: 1.4rem; height: 1.4rem;
  border-radius: 50%;
  flex: none;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 0.75rem;
}

.chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.chip-points {
  background: var(--tertiary);
  color: #3a3011;
  border-radius: var(--border-lg);
  padding: 0 var(--spacing-xs);
  font-size: 0.75rem;
  flex: none;
}

.menu {
  position: absolute;
  right: 0;
  top: calc(100% + var(--spacing-xs));
  background: var(--card);
  border-radius: var(--border-md);
  box-shadow: 0 0.4rem 1rem rgba(0, 0, 0, 0.3);
  overflow: hidden;
  z-index: 20;
  min-width: 12rem;
}

.menu-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: var(--spacing-sm) var(--spacing-md);
  white-space: nowrap;
}

.menu-item:hover { background: var(--card-sunk); }
.menu-item.danger { color: var(--error); }

/* Tabs */
#tabs {
  display: flex;
  align-items: flex-end;
  gap: var(--spacing-sm);
  background-color: var(--quaternary);
  /* No left padding: the tab row starts hard against the window edge. */
  padding: var(--spacing-sm) var(--spacing-sm) 0 0;
  flex: none;
}

.tab-strip {
  display: flex;
  align-items: flex-end;
  gap: 0;               /* tabs touch each other */
  min-width: 0;
  flex: 1;
}

.tab {
  position: relative;
  flex: none;
  padding: var(--spacing-sm) var(--spacing-md);
  background-color: var(--primary);
  color: var(--light-font);
  border-radius: var(--border-md) var(--border-md) 0 0;
  transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
  box-shadow: inset 0 -0.2rem 0.5rem var(--ghost);
  white-space: nowrap;
  font-weight: bold;
}

/* Touching tabs need a hairline between them, and the first one squares off
   against the window edge so it genuinely hugs the side. */
.tab + .tab { border-left: 1px solid rgba(255, 255, 255, 0.18); }
.tab:first-child { border-top-left-radius: 0; }

/* The condensed control that replaces the strip on a narrow screen. */
#tab-menu { display: none; position: relative; flex: 1; min-width: 0; }

#tab-menu-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-sm);
  width: 100%;
  padding: var(--spacing-sm) var(--spacing-md);
  background: var(--primary);
  color: #fff;
  border-radius: var(--border-md);
  font-weight: bold;
  min-height: 2.4rem;
}

#tab-menu-btn .caret { font-size: 0.7em; opacity: 0.85; }

#tab-menu-list {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + var(--spacing-xs));
  background: var(--card);
  border-radius: var(--border-md);
  box-shadow: 0 0.4rem 1rem rgba(0, 0, 0, 0.3);
  overflow: hidden;
  z-index: 25;
}

#tab-menu-list button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-sm);
  width: 100%;
  text-align: left;
  padding: var(--spacing-sm) var(--spacing-md);
  color: var(--dark-font);
}

#tab-menu-list button.on { background: var(--primary); color: #fff; }
#tab-menu-list button:not(.on):hover { background: var(--card-sunk); }

#tab-menu-list .n {
  background: var(--card-sunk);
  color: var(--muted);
  border-radius: var(--border-lg);
  padding: 0 var(--spacing-sm);
  font-size: 0.8em;
}

#tab-menu-list button.on .n { background: rgba(255, 255, 255, 0.25); color: #fff; }

.tab.active {
  background-color: var(--dark-bg);
  color: #fff;
  box-shadow: none;
}

.tab-count {
  display: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: var(--border-lg);
  padding: 0 var(--spacing-xs);
  margin-left: var(--spacing-xs);
  font-size: 0.75rem;
}

.tab-count.show { display: inline-block; }
.tab-count.alert { background: var(--warning); color: #40320a; }

/* Search */
#search { position: relative; flex: none; margin-bottom: var(--spacing-sm); }

#search-box {
  width: 11rem;
  padding: var(--spacing-xs) var(--spacing-lg) var(--spacing-xs)
           var(--spacing-sm);
  border-radius: var(--border-lg);
  border: 2px solid var(--primary);
  font-size: max(0.9rem, 16px);
}

#search-clear {
  position: absolute;
  top: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: var(--primary);
  color: #fff;
  height: 100%;
  aspect-ratio: 1;
  border-radius: 0 var(--border-lg) var(--border-lg) 0;
  font-size: 1.1rem;
  line-height: 1;
}

/* Content */
#content-field {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background-color: var(--dark-bg);
  box-shadow: inset 0 0.4rem 0.5rem rgba(0, 0, 0, 0.25);
  padding: var(--spacing-md);
  /* Room for the floating add button and the phone's home bar. */
  padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px));
}

.chore-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
  gap: var(--spacing-md);
  align-content: start;
}

/* -------------------------------------------------------------------
   Chore cards
   ------------------------------------------------------------------- */
.chore {
  background: var(--card);
  border-radius: var(--border-md);
  padding: var(--spacing-md);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
  border-left: var(--border-sm) solid var(--line);
  box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.25);
}

.chore.s-pool        { border-left-color: var(--primary); }
.chore.s-claimed     { border-left-color: var(--tertiary); }
.chore.s-in_progress { border-left-color: var(--quaternary); }
.chore.s-submitted   { border-left-color: var(--warning); }
.chore.s-done        { border-left-color: var(--success); opacity: 0.85; }
.chore.overdue       { border-left-color: var(--error); }

.chore-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-sm);
}

.chore-title { font-size: 1.05rem; font-weight: bold; word-break: break-word; }

.chore-points {
  flex: none;
  background: var(--tertiary);
  color: #3a3011;
  border-radius: var(--border-lg);
  padding: 0 var(--spacing-sm);
  font-size: 0.8rem;
  font-weight: bold;
  white-space: nowrap;
}

.chore-notes { color: var(--muted); font-size: 0.9rem; line-height: 1.4;
               word-break: break-word; }

.chore-meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-xs);
  font-size: 0.75rem;
}

.pill {
  background: var(--card-sunk);
  color: var(--muted);
  border-radius: var(--border-lg);
  padding: 0 var(--spacing-sm);
  white-space: nowrap;
}

.pill.who   { color: #fff; }
.pill.due   { background: #e8eef5; color: var(--primary); }
.pill.late  { background: #fdecea; color: var(--error); font-weight: bold; }
.pill.rep    { background: #efe8f5; color: var(--info); }

.chore-note-back {
  background: #fff8e1;
  border-left: var(--border-sm) solid var(--warning);
  padding: var(--spacing-sm);
  border-radius: var(--border-sm);
  font-size: 0.85rem;
}

.chore-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-xs);
  margin-top: auto;
  padding-top: var(--spacing-xs);
}

/* -------------------------------------------------------------------
   Empty states
   ------------------------------------------------------------------- */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--light-font);
  padding: var(--spacing-xl) var(--spacing-md);
}

.empty h2 { margin-bottom: var(--spacing-sm); }
.empty p { color: #b5b5b5; }

/* -------------------------------------------------------------------
   Floating add button
   ------------------------------------------------------------------- */
.fab {
  position: fixed;
  right: var(--spacing-md);
  bottom: calc(var(--spacing-md) + env(safe-area-inset-bottom, 0px));
  width: 3.4rem;
  height: 3.4rem;
  border-radius: 50%;
  background: var(--secondary);
  color: #fff;
  font-size: 2rem;
  line-height: 1;
  box-shadow: 0 0.3rem 0.8rem rgba(0, 0, 0, 0.4);
  z-index: 15;
}

/* -------------------------------------------------------------------
   Modals
   ------------------------------------------------------------------- */
.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--spacing-md);
  z-index: 40;
}

.modal {
  background: var(--card);
  border-radius: var(--border-lg);
  width: min(30rem, 100%);
  max-height: 90vh;
  max-height: 90dvh;
  overflow-y: auto;
  padding: var(--spacing-lg);
  box-shadow: 0 0.6rem 2rem rgba(0, 0, 0, 0.5);

  /* Scroll without the bar. A gutter appearing inside a rounded dialog cuts
     the corner off and reads as a rendering fault. It still scrolls by wheel,
     drag and keyboard. */
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.modal::-webkit-scrollbar { width: 0; height: 0; display: none; }

.modal-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--spacing-sm);
  margin-bottom: var(--spacing-md);
}

.modal-close { font-size: 1.5rem; line-height: 1; color: var(--muted); }

.modal-actions {
  display: flex;
  gap: var(--spacing-sm);
  justify-content: flex-end;
  margin-top: var(--spacing-md);
  flex-wrap: wrap;
}

.chips { display: flex; flex-wrap: wrap; gap: var(--spacing-xs); }

.chip-pick {
  padding: var(--spacing-xs) var(--spacing-sm);
  border-radius: var(--border-lg);
  background: var(--card-sunk);
  box-shadow: inset 0 0 0 2px var(--line);
  font-size: 0.85rem;
}

.chip-pick.on {
  background: var(--primary);
  color: #fff;
  box-shadow: none;
  font-weight: bold;
}

/* Manage-accounts rows */
.roster { display: flex; flex-direction: column; gap: var(--spacing-sm); }

.roster-row {
  display: flex;
  align-items: center;
