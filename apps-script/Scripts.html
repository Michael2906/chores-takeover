<script>
/* ===================================================================
   Chore Boar -- the whole client.
   An Apps Script web app serves no static files, so this is one classic
   script rather than the ES modules the old build used. No import/export:
   relative module paths cannot resolve inside the HtmlService sandbox.
   =================================================================== */
(function () {
  'use strict';

  // -----------------------------------------------------------------
  // Remembering the device
  // -----------------------------------------------------------------

  /**
   * localStorage, with a memory fallback.
   *
   * The app runs in an iframe on a googleusercontent.com origin, which makes
   * it third-party storage. Safari's tracking prevention blocks that outright,
   * and so does any browser set to refuse third-party cookies -- and a bare
   * localStorage read there THROWS rather than returning null. Falling back to
   * memory costs those users a sign-in per visit instead of a broken app.
   */
  var store = (function () {
    var mem = {};
    var ok = false;
    try {
      window.localStorage.setItem('cb.probe', '1');
      window.localStorage.removeItem('cb.probe');
      ok = true;
    } catch (e) {
      ok = false;
    }
    return {
      durable: ok,
      get: function (k) {
        try { return ok ? window.localStorage.getItem(k) : (mem[k] || null); }
        catch (e) { return mem[k] || null; }
      },
      set: function (k, v) {
        try { if (ok) window.localStorage.setItem(k, v); else mem[k] = v; }
        catch (e) { mem[k] = v; }
      },
      del: function (k) {
        try { if (ok) window.localStorage.removeItem(k); delete mem[k]; }
        catch (e) { delete mem[k]; }
      }
    };
  })();

  /**
   * The bridge to the wrapper page at the custom domain.
   *
   * Apps Script serves this app from a *.googleusercontent.com frame. Framed
   * again under thechoreboar.fyi, that frame is third-party and Safari will
   * not let it keep localStorage -- measured, not guessed: cloaked forwarding
   * asked for the password on every visit.
   *
   * So when we are inside our own wrapper, the wrapper holds the tokens in
   * ITS first-party storage and we talk to it over postMessage, which is not
   * storage-gated. Opened directly at the /exec URL there is no wrapper, and
   * localStorage is used exactly as before.
   */
  var bridge = { ready: false, win: null, origin: null };

  var cache = { household: '', member: '' };

  var TOKENS = {
    get household() { return cache.household; },
    set household(v) { cache.household = v || ''; persistTokens(); },
    get member() { return cache.member; },
    set member(v) { cache.member = v || ''; persistTokens(); }
  };

  function persistTokens() {
    if (bridge.ready) {
      bridge.win.postMessage({
        cb: 'save',
        household: cache.household,
        member: cache.member
      }, bridge.origin);
      return;
    }
    cache.household ? store.set('cb.householdToken', cache.household)
                    : store.del('cb.householdToken');
    cache.member ? store.set('cb.memberToken', cache.member)
                 : store.del('cb.memberToken');
  }

  /** Origins we will hand a live session to. Nothing else, ever. */
  function trustedWrapper(origin) {
    for (var i = 0; i < CONFIG_CLIENT.wrapperOrigins.length; i++) {
      if (CONFIG_CLIENT.wrapperOrigins[i] === origin) return true;
    }
    return false;
  }

  /**
   * Loads the tokens, then calls done().
   *
   * Asks the wrapper first and waits briefly; falls back to localStorage if
   * there is no wrapper or it does not answer. Either way done() runs exactly
   * once, so a silent wrapper delays start-up rather than hanging it.
   */
  function loadTokens(done) {
    function fromStore() {
      cache.household = store.get('cb.householdToken') || '';
      cache.member = store.get('cb.memberToken') || '';
    }

    // Not framed: nothing to talk to.
    if (window.top === window.self) { fromStore(); done(); return; }

    var settled = false;
    var finish = function () {
      if (settled) return;
      settled = true;
      window.removeEventListener('message', onMessage);
      done();
    };

    function onMessage(e) {
      if (settled) return;
      if (!trustedWrapper(e.origin) || !e.data || e.data.cb !== 'tokens') return;

      bridge.ready = true;
      bridge.win = e.source;
      bridge.origin = e.origin;
      cache.household = String(e.data.household || '');
      cache.member = String(e.data.member || '');
      finish();
    }

    window.addEventListener('message', onMessage);

    // '*' only for this opening hello, which carries nothing. Every reply is
    // checked against the allow-list before we trust it, and every token we
    // send afterwards goes to that verified origin by name.
    try {
      window.top.postMessage({ cb: 'hello' }, '*');
    } catch (err) {
      fromStore(); finish(); return;
    }

    setTimeout(function () {
      if (settled) return;
      // Framed by something that is not our wrapper -- an unmasked deployment
      // in an iframe, say. Behave as before.
      fromStore();
      finish();
    }, 900);
  }

  // -----------------------------------------------------------------
  // Talking to the server
  // -----------------------------------------------------------------

  /**
   * One call, one shape. Tokens ride along on every request so the server
   * decides what the caller may do -- the client never decides for itself.
   */
  /**
   * How many calls are in the air.
   *
   * Apps Script round-trips are slow enough -- often a second or two -- that
   * without a visible sign of life people tap Claim again, and again. A
   * counter rather than a boolean because two calls can overlap, and the bar
   * must not vanish when the first of them lands.
   */
  var inFlight = 0;

  function setBusy(delta) {
    inFlight = Math.max(0, inFlight + delta);
    var bar = $('progress');
    if (bar) bar.hidden = inFlight === 0;
  }

  function api(action, payload) {
    var body = payload || {};
    body.householdToken = TOKENS.household;
    body.memberToken = TOKENS.member;

    setBusy(1);
    var done = function () { setBusy(-1); };

    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (res) {
          done();
          if (res && res.ok) { resolve(res.data); return; }
          var msg = (res && res.error) || 'Something went wrong.';
          if (msg === 'SIGNED_OUT') {
            // The token lapsed under us. Back to whichever screen fits.
            TOKENS.member = '';
            boot();
            reject(new Error('SIGNED_OUT'));
            return;
          }
          reject(new Error(msg));
        })
        .withFailureHandler(function (err) {
          done();
          reject(new Error(
            (err && err.message) ||
            'Could not reach the server. Check your connection.'));
        })
        .call(action, body);
    });
  }

  // -----------------------------------------------------------------
  // State
  // -----------------------------------------------------------------

  var state = {
    household: null,
    members: [],
    me: null,
    chores: [],
    categories: [],
    pointPresets: [],
    suggestions: [],
    tab: 'community-pool',
    query: ''
  };

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/);
    return ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : ''))
      .toUpperCase();
  }

  // -----------------------------------------------------------------
  // Toast
  // -----------------------------------------------------------------

  var toastTimer = null;

  function toast(msg, kind) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 3600);
  }

  function fail(err) {
    if (err && err.message === 'SIGNED_OUT') return;
    toast((err && err.message) || String(err), 'bad');
  }

  /**
   * Puts a button into its waiting state.
   *
   * The label is kept and hidden rather than replaced, so the button holds
   * its width and the row does not jump about while it spins.
   */
  function busy(btn, on) {
    if (!btn) return;
    btn.disabled = !!on;
    btn.classList.toggle('is-busy', !!on);
  }

  /** Dims a whole chore card while one of its buttons is working. */
  function busyCard(el, on) {
    if (el) el.classList.toggle('is-busy', !!on);
  }

  /**
   * A blocking overlay for the jobs that rebuild the whole board.
   *
   * Filling the trough writes a row per chore, which on a long list is slow
   * enough that the board looks frozen. Better to say what is happening.
   */
  function working(message) {
    var host = $('app');
    var el = document.createElement('div');
    el.className = 'working';
    el.innerHTML = '<div class="spinner"></div><div>' + esc(message) + '</div>';
    host.appendChild(el);
    return function () { if (el.parentNode) el.parentNode.removeChild(el); };
  }

  // -----------------------------------------------------------------
  // Screens
  // -----------------------------------------------------------------

  function show(which) {
    ['splash', 'gate', 'picker', 'app'].forEach(function (id) {
      $(id).hidden = (id !== which);
    });
  }

  /** Decides which screen to show, from whatever the device remembered. */
  function boot() {
    show('splash');
    api('resumeSession', {})
      .then(function (data) {
        if (!data.signedIn) {
          TOKENS.household = '';
          TOKENS.member = '';
          show('gate');
          return;
        }
        state.household = data.household;
        state.members = data.members || [];

        if (data.me) {
          state.me = data.me;
          return refresh().then(function () { show('app'); });
        }
        renderPicker();
        show('picker');
      })
      .catch(function (err) {
        if (err && err.message === 'SIGNED_OUT') return;
        show('gate');
        toast(err.message, 'bad');
      });
  }

  // -----------------------------------------------------------------
  // Screen 1 -- sign in / create household
  // -----------------------------------------------------------------

  function wireGate() {
    var signinBtn = $('seg-signin');
    var createBtn = $('seg-create');

    function pick(which) {
      var isSignin = which === 'signin';
      signinBtn.classList.toggle('active', isSignin);
      createBtn.classList.toggle('active', !isSignin);
      signinBtn.setAttribute('aria-selected', String(isSignin));
      createBtn.setAttribute('aria-selected', String(!isSignin));
      $('form-signin').hidden = !isSignin;
      $('form-create').hidden = isSignin;
    }

    signinBtn.addEventListener('click', function () { pick('signin'); });
    createBtn.addEventListener('click', function () { pick('create'); });

    $('form-signin').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target;
      var btn = f.querySelector('button[type=submit]');
      var err = $('signin-error');
      err.hidden = true;
      busy(btn, true);

      api('signInHousehold', {
        email: f.email.value,
        password: f.password.value,
        deviceLabel: deviceLabel()
      }).then(function (data) {
        TOKENS.household = data.householdToken;
        TOKENS.member = '';
        state.household = data.household;
        state.members = data.members || [];
        f.password.value = '';
        renderPicker();
        show('picker');
      }).catch(function (e2) {
        err.textContent = e2.message;
        err.hidden = false;
      }).then(function () { busy(btn, false); });
    });

    $('form-create').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target;
      var btn = f.querySelector('button[type=submit]');
      var err = $('create-error');
      err.hidden = true;
      busy(btn, true);

      api('createHousehold', {
        householdName: f.householdName.value,
        ownerName: f.ownerName.value,
        email: f.email.value,
        password: f.password.value,
        deviceLabel: deviceLabel()
      }).then(function (data) {
        TOKENS.household = data.householdToken;
        TOKENS.member = '';
        state.household = data.household;
        state.members = data.members || [];
        f.password.value = '';
        renderPicker();
        show('picker');
        toast('Household created. Tap your name to start.', 'good');
      }).catch(function (e2) {
        err.textContent = e2.message;
        err.hidden = false;
      }).then(function () { busy(btn, false); });
    });
  }

  /** A rough name for this device, so the Sessions sheet is readable. */
  function deviceLabel() {
    var ua = navigator.userAgent || '';
    var kind = /iPhone|Android.*Mobile/.test(ua) ? 'Phone'
             : /iPad|Tablet/.test(ua) ? 'Tablet' : 'Computer';
    var os = /Windows/.test(ua) ? 'Windows'
           : /Mac OS X/.test(ua) ? 'Mac'
           : /Android/.test(ua) ? 'Android'
           : /iPhone|iPad|iPod/.test(ua) ? 'iOS' : '';
    return (os ? os + ' ' : '') + kind;
  }

  // -----------------------------------------------------------------
  // Screen 2 -- who is using this device
  // -----------------------------------------------------------------

  function renderPicker() {
    $('picker-household').textContent =
      state.household ? state.household.name : "Who's this?";

    $('member-grid').innerHTML = state.members.map(function (m) {
      return '' +
        '<button class="member-tile" data-member="' + esc(m.memberId) + '">' +
          '<span class="avatar" style="background:' + esc(m.color || '#02407d') + '">' +
            esc(initials(m.name)) +
          '</span>' +
          '<span class="name">' + esc(m.name) + '</span>' +
          (m.canApprove ? '<span class="role">Parent</span>' : '') +
          (m.hasPin ? '<span class="lock">PIN</span>' : '') +
        '</button>';
    }).join('');
  }

  function wirePicker() {
    $('member-grid').addEventListener('click', function (e) {
      var tile = e.target.closest('[data-member]');
      if (!tile) return;
      var id = tile.dataset.member;
      var m = state.members.filter(function (x) { return x.memberId === id; })[0];
      if (!m) return;

      if (m.hasPin) { askPin(m); return; }
      enterAs(m.memberId, '');
    });

    $('picker-signout').addEventListener('click', function () {
      confirmModal(
        'Sign this device out?',
        'You will need the household email and password to get back in.',
        'Sign out',
        function () {
          api('signOutDevice', {}).then(function () {
            TOKENS.household = '';
            TOKENS.member = '';
            show('gate');
          }).catch(fail);
        });
    });
  }

  /** Completes the pick and lands on the board. */
  function enterAs(memberId, pin, onError) {
    return api('pickMember', { memberId: memberId, pin: pin })
      .then(function (data) {
        TOKENS.member = data.memberToken;
        state.me = data.me;
        return refresh();
      })
      .then(function () {
        closeModal();
        show('app');
      })
      .catch(function (err) {
        if (onError) onError(err); else fail(err);
      });
  }

  /** The PIN pad. Deliberately big buttons -- children use this on a phone. */
  function askPin(member) {
    var len = CONFIG_CLIENT.pinLength;
    var entered = '';

    var keys = ['1','2','3','4','5','6','7','8','9','back','0','go'];

    openModal(
      esc(member.name),
      '<p class="form-hint" style="text-align:center">Enter your PIN</p>' +
      '<div class="pin-dots" id="pin-dots"></div>' +
      '<p class="form-error" id="pin-error" role="alert" hidden></p>' +
      '<div class="pin-pad">' +
        keys.map(function (k) {
          if (k === 'back') return '<button class="pin-key wide" data-pin="back">⌫</button>';
          if (k === 'go') return '<button class="pin-key wide" data-pin="go">OK</button>';
          return '<button class="pin-key" data-pin="' + k + '">' + k + '</button>';
        }).join('') +
      '</div>',
      [{ label: 'Cancel', kind: 'btn-secondary', act: closeModal }]
    );

    function paint() {
      var dots = [];
      for (var i = 0; i < len; i++) {
        dots.push('<span class="pin-dot' + (i < entered.length ? ' filled' : '') + '"></span>');
      }
      $('pin-dots').innerHTML = dots.join('');
    }
    paint();

    function submit() {
      if (entered.length !== len) return;
      var err = $('pin-error');
      err.hidden = true;
      enterAs(member.memberId, entered, function (e) {
        entered = '';
        paint();
        err.textContent = e.message;
        err.hidden = false;
      });
    }

    document.querySelector('.pin-pad').addEventListener('click', function (e) {
      var k = e.target.closest('[data-pin]');
      if (!k) return;
      var v = k.dataset.pin;

      if (v === 'back') entered = entered.slice(0, -1);
      else if (v === 'go') { submit(); return; }
      else if (entered.length < len) entered += v;

      paint();
      // Filling the last digit submits, so nobody has to find OK.
      if (entered.length === len) submit();
    });

    // A physical keyboard should work too.
    var onKey = function (e) {
      if (/^[0-9]$/.test(e.key)) {
        if (entered.length < len) { entered += e.key; paint(); }
        if (entered.length === len) submit();
      } else if (e.key === 'Backspace') {
        entered = entered.slice(0, -1); paint();
      } else if (e.key === 'Enter') { submit(); }
    };
    document.addEventListener('keydown', onKey);
    modalCleanup = function () { document.removeEventListener('keydown', onKey); };
  }

  // -----------------------------------------------------------------
  // Screen 3 -- the board
  // -----------------------------------------------------------------

  /** Pulls the whole board and repaints. */
  function refresh() {
    return api('loadBoard', {}).then(applyBoard);
  }

  function applyBoard(data) {
    state.me = data.me;
    state.members = data.members || [];
    state.chores = data.chores || [];
    state.categories = data.categories || [];
    state.pointPresets = data.pointPresets || [];
    state.suggestions = data.suggestions || [];
    renderApp();
    return data;
  }

  function renderApp() {
    $('header-household').textContent =
      state.household ? state.household.name : '';

    var me = state.me || {};
    $('chip-dot').style.background = me.color || '#02407d';
    $('chip-dot').textContent = initials(me.name);
    $('chip-name').textContent = me.name || '';
    $('chip-points').textContent = (me.points || 0) + 'p';

    // Managing accounts is the account holder's alone -- a second parent can
    // approve chores without being able to rename a child or reset a PIN.
    var isOwner = me.role === 'owner';
    document.querySelectorAll('[data-menu=accounts]').forEach(function (b) {
      b.hidden = !isOwner;
    });
    document.querySelectorAll('[data-menu=password]').forEach(function (b) {
      b.hidden = !isOwner;
    });

    // Only parents post chores, so the add button is theirs alone. The server
    // refuses either way; this stops a child being shown a button that fails.
    $('new-chore').hidden = !me.canApprove;

    // The Trough is read-only for a child -- a list they cannot add to or
    // hand out -- so it is not worth a menu entry. The Prize Pen stays: that
    // one is mostly for them.
    document.querySelectorAll('[data-menu=trough]').forEach(function (b) {
      b.hidden = !me.canApprove;
    });

    renderCounts();
    renderContent();
  }

  // --- Tab bucketing ------------------------------------------------

  /**
   * Which tab a chore belongs on for the person looking at it.
   *
   * A parent sees everybody's work in progress and everything awaiting
   * approval; anyone else sees only their own. Done is shared -- the point of
   * a household board is that finished work is visible.
   */
  function choresFor(tabId) {
    var me = state.me || {};
    var mine = function (c) { return c.assigneeId === me.memberId; };

    return state.chores.filter(function (c) {
      switch (tabId) {
        case 'community-pool':     return c.status === 'pool';
        case 'my-chores':          return c.status === 'claimed' && mine(c);
        case 'in-progress':        return c.status === 'in_progress' &&
                                          (me.canApprove || mine(c));
        case 'ready-for-approval': return c.status === 'submitted' &&
                                          (me.canApprove || mine(c));
        case 'done':               return c.status === 'done';
        default: return false;
      }
    });
  }

  /** The five tabs, in order, with the label each one shows. */
  function tabList() {
    return [
      { id: 'community-pool',     label: 'Community Pool' },
      { id: 'my-chores',          label: 'My Chores' },
      { id: 'in-progress',        label: 'In Progress' },
      { id: 'ready-for-approval', label: 'Ready for Approval' },
      { id: 'done',               label: 'Done' }
    ];
  }

  function renderCounts() {
    var boss = !!(state.me && state.me.canApprove);

    tabList().forEach(function (t) {
      var n = choresFor(t.id).length;
      var badge = $(t.id).querySelector('.tab-count');
      badge.textContent = n;
      badge.classList.toggle('show', n > 0);
      // Approvals are the one queue somebody is actively waiting on.
      badge.classList.toggle(
        'alert', t.id === 'ready-for-approval' && n > 0 && boss);
    });

    renderTabMenu();
  }

  /**
   * The narrow-screen dropdown.
   *
   * Rebuilt from the same counts as the strip rather than kept in its own
   * state, so the two can never disagree about which tab is active.
   */
  function renderTabMenu() {
    var current = tabList().filter(function (t) {
      return t.id === state.tab;
    })[0] || tabList()[0];

    $('tab-menu-label').textContent = current.label;

    $('tab-menu-list').innerHTML = tabList().map(function (t) {
      var n = choresFor(t.id).length;
      return '<button data-goto="' + t.id + '"' +
             (t.id === state.tab ? ' class="on"' : '') + '>' +
               '<span>' + esc(t.label) + '</span>' +
               (n ? '<span class="n">' + n + '</span>' : '') +
             '</button>';
    }).join('');
  }

  /** Moves to a tab from either control. */
  function selectTab(id) {
    state.tab = id;
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.id === id);
      t.setAttribute('aria-selected', String(t.id === id));
    });
    renderTabMenu();
    renderContent();
    $('content-field').scrollTop = 0;
  }

  function matchesQuery(c) {
    if (!state.query) return true;
    var q = state.query.toLowerCase();
    return [c.title, c.notes, c.category, c.assigneeName, c.createdByName]
      .join(' ').toLowerCase().indexOf(q) >= 0;
  }

  function renderContent() {
    var list = choresFor(state.tab).filter(matchesQuery);
    var field = $('content-field');

    if (!list.length) {
      field.innerHTML = '<div class="chore-list">' + emptyState() + '</div>';
      return;
    }
    field.innerHTML = '<div class="chore-list">' +
      list.map(choreCard).join('') + '</div>';
  }

  function emptyState() {
    if (state.query) {
      return '<div class="empty"><h2>Nothing matches</h2>' +
             '<p>No chore here mentions “' + esc(state.query) + '”.</p></div>';
    }
    var copy = {
      'community-pool': ['The pool is empty',
                         'Nothing is going spare. Add a chore with the + button.'],
      'my-chores': ['You have not claimed anything',
                    'Take something from the Community Pool.'],
      'in-progress': ['Nothing on the go',
                      'Chores you have started show up here.'],
      'ready-for-approval': ['Nothing waiting',
                             'Finished chores land here for a parent to approve.'],
      'done': ['Nothing finished yet', 'Approved chores are kept here.']
    }[state.tab] || ['Nothing here', ''];

    return '<div class="empty"><h2>' + esc(copy[0]) + '</h2>' +
           '<p>' + esc(copy[1]) + '</p></div>';
  }

  // --- One chore ----------------------------------------------------

  function choreCard(c) {
    var me = state.me || {};
    var mine = c.assigneeId === me.memberId;

    var meta = [];
    if (c.category) meta.push('<span class="pill">' + esc(c.category) + '</span>');
    if (c.assigneeName) {
      meta.push('<span class="pill who" style="background:' +
                esc(c.assigneeColor || '#02407d') + '">' +
                esc(c.assigneeName) + '</span>');
    }
    if (c.dueDate) {
      meta.push('<span class="pill ' + (c.overdue ? 'late' : 'due') + '">' +
                (c.overdue ? 'Overdue ' : 'Due ') + esc(prettyDate(c.dueDate)) +
                '</span>');
    }
    if (c.recurrence) {
      meta.push('<span class="pill rep">' + esc(c.recurrence) + '</span>');
    }
    if (c.status === 'done' && c.approvedByName) {
      meta.push('<span class="pill">OK’d by ' + esc(c.approvedByName) + '</span>');
    }

    return '' +
      '<article class="chore s-' + esc(c.status) + (c.overdue ? ' overdue' : '') +
              '" data-chore="' + esc(c.choreId) + '">' +
        '<div class="chore-top">' +
          '<h3 class="chore-title">' + esc(c.title) + '</h3>' +
          (c.points ? '<span class="chore-points">' + c.points + 'p</span>' : '') +
        '</div>' +
        (c.notes ? '<p class="chore-notes">' + esc(c.notes) + '</p>' : '') +
        (meta.length ? '<div class="chore-meta">' + meta.join('') + '</div>' : '') +
        (c.reviewNote
          ? '<p class="chore-note-back"><strong>Sent back:</strong> ' +
            esc(c.reviewNote) + '</p>'
          : '') +
        '<div class="chore-actions">' + actionsFor(c, me, mine) + '</div>' +
      '</article>';
  }

  function btn(act, label, kind) {
    return '<button class="btn btn-sm ' + kind + '" data-act="' + act + '">' +
           esc(label) + '</button>';
  }

  function actionsFor(c, me, mine) {
    var out = [];
    var boss = !!me.canApprove;

    if (c.status === 'pool') {
      out.push(btn('claim', 'Claim', 'btn-go'));
      if (boss) out.push(btn('assign', 'Give to…', 'btn-secondary'));
    } else if (c.status === 'claimed' && (mine || boss)) {
      out.push(btn('start', 'Start', 'btn-primary'));
      out.push(btn('submit', 'Mark done', 'btn-go'));
      out.push(btn('release', 'Put back', 'btn-secondary'));
    } else if (c.status === 'in_progress' && (mine || boss)) {
      out.push(btn('submit', 'Mark done', 'btn-go'));
      out.push(btn('pause', 'Pause', 'btn-secondary'));
    } else if (c.status === 'submitted') {
      if (boss) {
        out.push(btn('approve', 'Approve', 'btn-go'));
        out.push(btn('sendback', 'Send back', 'btn-warn'));
      } else {
        out.push('<span class="pill">Waiting for a parent</span>');
      }
    } else if (c.status === 'done' && boss) {
      out.push(btn('reopen', 'Do it again', 'btn-secondary'));
    }

    // Editing: a parent always; anyone else only their own, still in the pool.
    var canEdit = boss ||
                  (c.createdBy === me.memberId && c.status === 'pool');
    if (canEdit && c.status !== 'done') {
      out.push(btn('edit', 'Edit', 'btn-secondary'));
    }
    if (canEdit) out.push(btn('delete', 'Delete', 'btn-quiet'));

    return out.join('');
  }

  function prettyDate(iso) {
    var d = new Date(iso + 'T12:00:00');
    if (isNaN(d.getTime())) return iso;
    var today = new Date(); today.setHours(12, 0, 0, 0);
    var days = Math.round((d - today) / 86400000);
    if (days === 0) return 'today';
    if (days === 1) return 'tomorrow';
    if (days === -1) return 'yesterday';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // --- Board interactions -------------------------------------------

  function wireApp() {
    // Tabs -- the strip on a wide screen...
    $('tab-strip').addEventListener('click', function (e) {
      var tab = e.target.closest('.tab');
      if (tab) selectTab(tab.id);
    });

    // ...and the dropdown on a narrow one.
    var tabBtn = $('tab-menu-btn');
    var tabList_ = $('tab-menu-list');

    tabBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = tabList_.hidden;
      tabList_.hidden = !open;
      tabBtn.setAttribute('aria-expanded', String(open));
    });

    tabList_.addEventListener('click', function (e) {
      var b = e.target.closest('[data-goto]');
      if (!b) return;
      tabList_.hidden = true;
      tabBtn.setAttribute('aria-expanded', 'false');
      selectTab(b.dataset.goto);
    });

    document.addEventListener('click', function () {
      if (!tabList_.hidden) {
        tabList_.hidden = true;
        tabBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // Search
    var searchTimer = null;
    $('search-box').addEventListener('input', function (e) {
      clearTimeout(searchTimer);
      var v = e.target.value;
      searchTimer = setTimeout(function () {
        state.query = v.trim();
        renderContent();
      }, 120);
    });

    $('search-clear').addEventListener('click', function () {
      $('search-box').value = '';
      state.query = '';
      renderContent();
      $('search-box').focus();
    });

    // Chore actions
    $('content-field').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var card = b.closest('[data-chore]');
      if (!card) return;
      doAction(b.dataset.act, card.dataset.chore, b);
    });

    // Add
    $('new-chore').addEventListener('click', function () { choreForm(null); });

    // Account menu
    var chip = $('account-chip');
    var menu = $('account-menu');

    chip.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = menu.hidden;
      menu.hidden = !open;
      chip.setAttribute('aria-expanded', String(open));
    });

    document.addEventListener('click', function () {
      if (!menu.hidden) {
        menu.hidden = true;
        chip.setAttribute('aria-expanded', 'false');
      }
    });

    menu.addEventListener('click', function (e) {
      var item = e.target.closest('[data-menu]');
      if (!item) return;
      menu.hidden = true;
      chip.setAttribute('aria-expanded', 'false');
      menuAction(item.dataset.menu);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !menu.hidden) menu.hidden = true;
    });
  }

  function doAction(act, choreId, button) {
    var c = state.chores.filter(function (x) { return x.choreId === choreId; })[0];

    if (act === 'edit') { choreForm(c); return; }
    if (act === 'assign') { assignForm(c); return; }
    if (act === 'sendback') { sendBackForm(c); return; }
    if (act === 'delete') {
      confirmModal('Delete this chore?', c ? c.title : '', 'Delete', function () {
        run('deleteChore', { choreId: choreId }, 'Deleted.');
      }, true);
      return;
    }

    var map = {
      claim:   ['claimChore',   'Claimed. It is yours.'],
      release: ['releaseChore', 'Back in the pool.'],
      start:   ['startChore',   'Started.'],
      pause:   ['pauseChore',   'Paused.'],
      submit:  ['submitChore',  'Sent for approval.'],
      approve: ['approveChore', 'Approved.'],
      reopen:  ['reopenChore',  'Back in the pool.']
    }[act];
    if (!map) return;

    // The card as a whole goes quiet, not just the button that was pressed --
    // otherwise Claim spins while Edit next to it is still live.
    var card = button.closest('[data-chore]');
    busy(button, true);
    busyCard(card, true);

    api(map[0], { choreId: choreId })
      .then(function (data) { applyBoard(data); toast(map[1], 'good'); })
      .catch(function (err) {
        fail(err);
        // A rejected transition usually means somebody else moved first, so
        // the card in front of them is stale. Repaint from the server.
        refresh().catch(function () {});
      })
      .then(function () { busy(button, false); busyCard(card, false); });
  }

  /** Runs an action, repaints from its reply, and says so. */
  function run(action, payload, okMsg) {
    return api(action, payload)
      .then(function (data) {
        applyBoard(data);
        closeModal();
        if (okMsg) toast(okMsg, 'good');
      })
      .catch(fail);
  }

  function menuAction(which) {
    if (which === 'switch') {
      api('releaseMember', {}).then(function () {
        TOKENS.member = '';
        state.me = null;
        renderPicker();
        show('picker');
      }).catch(fail);

    } else if (which === 'signout') {
      confirmModal('Sign this device out?',
        'You will need the household email and password to get back in.',
        'Sign out', function () {
          api('signOutDevice', {}).then(function () {
            TOKENS.household = '';
            TOKENS.member = '';
            closeModal();
            show('gate');
          }).catch(fail);
        });

    } else if (which === 'accounts') {
      accountsForm();
    } else if (which === 'password') {
      passwordForm();
    } else if (which === 'trough') {
      troughForm();
    } else if (which === 'store') {
      storeForm();
    }
  }

  // -----------------------------------------------------------------
  // The Trough -- the daily hand-out
  // -----------------------------------------------------------------

  function troughForm() {
    api('loadTrough', {}).then(renderTrough).catch(fail);
  }

  function renderTrough(t) {
    var rows = t.items.length
      ? t.items.map(function (i) {
          return '<div class="list-row">' +
            '<span class="grow"><span class="t">' + esc(i.title) + '</span>' +
              (i.category || i.notes
                ? '<br><span class="sub">' +
                  esc([i.category, i.notes].filter(Boolean).join(' - ')) +
                  '</span>'
                : '') +
            '</span>' +
            '<span class="cost">' + i.points + 'p</span>' +
            (t.canEdit
              ? '<button class="btn btn-sm btn-secondary" data-tedit="' +
                  esc(i.troughId) + '">Edit</button>' +
                '<button class="btn btn-sm btn-quiet" data-tdel="' +
                  esc(i.troughId) + '">Remove</button>'
              : '') +
          '</div>';
        }).join('')
      : '<p class="form-hint">Nothing on the list yet.</p>';

    var last = t.lastFilled
      ? '<p class="form-hint" style="text-align:left">Filled today - ' +
          t.lastFilled.total + ' chores handed out.</p>' +
        '<div class="fill-summary">' +
          t.lastFilled.perPerson.map(function (p) {
            return '<span class="fill-chip">' +
              '<span class="dot" style="background:' + esc(p.color) + '"></span>' +
              esc(p.name) + ' &middot; ' + p.count + ' &middot; ' + p.points + 'p</span>';
          }).join('') +
        '</div>'
      : '<p class="form-hint" style="text-align:left">Not filled today yet.</p>';

    openModal(esc(t.name),
      '<p class="form-hint" style="text-align:left">' +
        'The chores that need doing every day. Filling the trough shares them ' +
        'out: nobody gets the same one two days running, the children get the ' +
        'bigger share, and the points come out roughly even.' +
      '</p>' +
      last +
      '<hr class="hr">' +
      '<div class="list-rows" id="trough-rows">' + rows + '</div>' +
      (t.canEdit
        ? '<hr class="hr">' +
          '<form class="form" id="trough-add">' +
            '<label class="field"><span>Add to the list</span>' +
              '<input name="title" list="sugg-list-t" maxlength="120" ' +
                     'autocomplete="off" placeholder="Pick one, or type your own" />' +
              '<datalist id="sugg-list-t">' +
                state.suggestions.map(function (x) {
                  return '<option value="' + esc(x.title) + '"></option>';
                }).join('') +
              '</datalist></label>' +
            '<div class="chips">' +
              '<input type="number" name="points" min="0" max="999" ' +
                     'placeholder="Points" style="max-width:7rem" />' +
              '<input name="category" list="cat-list-t" maxlength="40" ' +
                     'placeholder="Category" style="max-width:10rem" />' +
              '<datalist id="cat-list-t">' +
                state.categories.map(function (c) {
                  return '<option value="' + esc(c) + '"></option>';
                }).join('') +
              '</datalist>' +
            '</div>' +
          '</form>'
        : ''),
      [{ label: 'Close', kind: 'btn-secondary', act: closeModal }]
        .concat(t.canEdit ? [
          { label: 'Add', kind: 'btn-secondary', act: function (btn) {
              var f = $('trough-add');
              if (!f.title.value.trim()) { toast('Enter a chore.', 'bad'); return; }
              busy(btn, true);
              api('addTroughItem', {
                title: f.title.value,
                points: f.points.value,
                category: f.category.value
              }).then(function (data) {
                renderTrough(data);
                toast('Added to the list.', 'good');
              }).catch(fail).then(function () { busy(btn, false); });
            } }
        ] : [])
        .concat(t.canFill ? [
          { label: 'Fill the trough', kind: 'btn-primary', act: function (btn) {
              doFill(btn, false);
            } }
        ] : []));

    // Picking a ready-made chore fills the points and category in.
    var addForm = $('trough-add');
    if (addForm) {
      addForm.title.addEventListener('input', function () {
        var typed = addForm.title.value.trim().toLowerCase();
        for (var i = 0; i < state.suggestions.length; i++) {
          var x = state.suggestions[i];
          if (String(x.title).toLowerCase() === typed) {
            addForm.points.value = x.points;
            addForm.category.value = x.category || '';
            return;
          }
        }
      });
    }

    var host = $('trough-rows');
    if (host) {
      host.addEventListener('click', function (e) {
        var del = e.target.closest('[data-tdel]');
        var ed = e.target.closest('[data-tedit]');

        if (del) {
          busy(del, true);
          api('removeTroughItem', { troughId: del.dataset.tdel })
            .then(renderTrough).catch(fail);
          return;
        }
        if (ed) {
          var item = t.items.filter(function (i) {
            return i.troughId === ed.dataset.tedit;
          })[0];
          if (item) troughItemForm(item);
        }
      });
    }
  }

  /**
   * Runs the hand-out.
   *
   * Filling twice in a day would double everybody's work, so the server
   * refuses a second run and says so. `again` is what the confirmation sends
   * back when that is genuinely what was wanted.
   */
  function doFill(btn, again) {
    busy(btn, true);
    var stop = working('Sharing the chores out...');

    api('fillTrough', { again: !!again })
      .then(function (data) {
        applyBoard(data);
        closeModal();
        toast('Chores handed out.', 'good');
      })
      .catch(function (err) {
        var m = String(err.message || '');
        if (m.indexOf('ALREADY_FILLED:') === 0) {
          var n = m.split(':')[1];
          confirmModal('Already filled today',
            'The trough has already been filled today - ' + n +
            ' chores are out. Filling it again adds another full set on top.',
            'Fill it again', function (b) { doFill(b, true); });
          return;
        }
        fail(err);
      })
      .then(function () { stop(); busy(btn, false); });
  }

  function troughItemForm(item) {
    openModal('Edit ' + esc(item.title),
      '<form class="form" id="titem-form">' +
        '<label class="field"><span>Chore</span>' +
          '<input name="title" value="' + esc(item.title) + '" maxlength="120" /></label>' +
        '<label class="field"><span>Points</span>' +
          '<input type="number" name="points" min="0" max="999" value="' +
            (item.points || 0) + '" /></label>' +
        '<label class="field"><span>Category</span>' +
          '<input name="category" value="' + esc(item.category || '') +
          '" maxlength="40" /></label>' +
        '<label class="field"><span>Details</span>' +
          '<textarea name="notes" maxlength="1000">' + esc(item.notes || '') +
          '</textarea></label>' +
      '</form>',
      [
        { label: 'Back', kind: 'btn-secondary', act: troughForm },
        { label: 'Save', kind: 'btn-primary', act: function (btn) {
            var f = $('titem-form');
            busy(btn, true);
            api('updateTroughItem', {
              troughId: item.troughId,
              title: f.title.value,
              points: f.points.value,
              category: f.category.value,
              notes: f.notes.value
            }).then(function (data) {
              renderTrough(data);
              toast('Saved.', 'good');
            }).catch(fail).then(function () { busy(btn, false); });
          } }
      ]);
  }

  // -----------------------------------------------------------------
  // Modals
  // -----------------------------------------------------------------

  var modalCleanup = null;

  function openModal(title, bodyHtml, buttons) {
    closeModal();

    var acts = (buttons || []).map(function (b, i) {
      return '<button class="btn ' + (b.kind || 'btn-secondary') +
             '" data-modal-btn="' + i + '">' + esc(b.label) + '</button>';
    }).join('');

    var root = $('modal-root');
    root.innerHTML =
      '<div class="backdrop" id="backdrop">' +
        '<div class="modal" role="dialog" aria-modal="true">' +
          '<div class="modal-head">' +
            '<h2>' + title + '</h2>' +
            '<button class="modal-close" aria-label="Close">×</button>' +
          '</div>' +
          '<div class="modal-body">' + bodyHtml + '</div>' +
          (acts ? '<div class="modal-actions">' + acts + '</div>' : '') +
        '</div>' +
      '</div>';

    root.querySelector('.modal-close').addEventListener('click', closeModal);

    root.querySelector('.backdrop').addEventListener('mousedown', function (e) {
      if (e.target.id === 'backdrop') closeModal();
    });

    (buttons || []).forEach(function (b, i) {
      var el = root.querySelector('[data-modal-btn="' + i + '"]');
      if (el) el.addEventListener('click', function () { b.act(el); });
    });

    var onEsc = function (e) { if (e.key === 'Escape') closeModal(); };
    document.addEventListener('keydown', onEsc);
    var prevCleanup = modalCleanup;
    modalCleanup = function () {
      document.removeEventListener('keydown', onEsc);
      if (prevCleanup) prevCleanup();
    };

    // Focus the first real control so a keyboard user starts inside.
    var first = root.querySelector('input, select, textarea, button');
    if (first) first.focus();
  }

  function closeModal() {
    if (modalCleanup) { modalCleanup(); modalCleanup = null; }
    $('modal-root').innerHTML = '';
  }

  function confirmModal(title, body, okLabel, onOk, danger) {
    openModal(esc(title),
      body ? '<p>' + esc(body) + '</p>' : '',
      [
        { label: 'Cancel', kind: 'btn-secondary', act: closeModal },
        { label: okLabel, kind: danger ? 'btn-danger' : 'btn-primary',
          act: onOk }
      ]);
  }

  // --- New / edit a chore -------------------------------------------

  function choreForm(existing) {
    var editing = !!existing;
    var c = existing || {};

    var cats = state.categories.map(function (x) {
      return '<option value="' + esc(x) + '"></option>';
    }).join('');

    var chosen = Number(c.points) || 0;
    var isPreset = state.pointPresets.indexOf(chosen) >= 0 || chosen === 0;

    var pts = state.pointPresets.map(function (p) {
      return '<button type="button" class="chip-pick' +
             (chosen === p ? ' on' : '') +
             '" data-points="' + p + '">' + p + 'p</button>';
    }).join('');

    // Ready-made chores. Picking one fills the rest of the form in; typing
    // something not on the list just leaves the form to be filled by hand.
    var suggs = state.suggestions.map(function (x) {
      return '<option value="' + esc(x.title) + '"></option>';
    }).join('');

    var people = state.members.map(function (m) {
      return '<option value="' + esc(m.memberId) + '"' +
             (c.assigneeId === m.memberId ? ' selected' : '') + '>' +
             esc(m.name) + '</option>';
    }).join('');

    openModal(editing ? 'Edit chore' : 'New chore',
      '<form class="form" id="chore-form">' +
        '<label class="field"><span>What needs doing?</span>' +
          '<input name="title" required maxlength="120" list="sugg-list" ' +
                 'autocomplete="off" ' +
                 'value="' + esc(c.title || '') + '" ' +
                 'placeholder="Pick one, or type your own" />' +
          '<datalist id="sugg-list">' + suggs + '</datalist>' +
          '<small id="sugg-hint">' +
            (state.suggestions.length
              ? 'Pick a ready-made chore to fill the rest in, or type your own.'
              : '') +
          '</small></label>' +

        '<label class="field"><span>Details <small>(optional)</small></span>' +
          '<textarea name="notes" maxlength="1000">' + esc(c.notes || '') +
          '</textarea></label>' +

        '<label class="field"><span>Category</span>' +
          '<input name="category" list="cat-list" maxlength="40" ' +
                 'value="' + esc(c.category || '') + '" />' +
          '<datalist id="cat-list">' + cats + '</datalist></label>' +

        '<div class="field"><span>Points</span>' +
          '<div class="chips" id="point-chips">' + pts +
            '<button type="button" class="chip-pick' +
              (chosen === 0 ? ' on' : '') + '" data-points="0">None</button>' +
            '<button type="button" class="chip-pick' +
              (isPreset ? '' : ' on') + '" data-points="custom">Custom…</button>' +
          '</div>' +
          '<input type="number" id="point-custom" name="pointsCustom" ' +
                 'min="0" max="999" step="1" placeholder="Points" ' +
                 'value="' + (isPreset ? '' : chosen) + '"' +
                 (isPreset ? ' hidden' : '') + ' />' +
          '<input type="hidden" name="points" value="' + chosen + '" />' +
        '</div>' +

        '<label class="field"><span>Due <small>(optional)</small></span>' +
          '<input type="date" name="dueDate" value="' + esc(c.dueDate || '') +
          '" /></label>' +

        '<label class="field"><span>Repeats</span>' +
          '<select name="recurrence">' +
            ['', 'daily', 'weekly', 'monthly'].map(function (r) {
              return '<option value="' + r + '"' +
                     ((c.recurrence || '') === r ? ' selected' : '') + '>' +
                     (r ? r.charAt(0).toUpperCase() + r.slice(1) : 'Does not repeat') +
                     '</option>';
            }).join('') +
          '</select>' +
          '<small>A repeating chore reposts itself once approved.</small>' +
        '</label>' +

        (!editing
          ? '<label class="field"><span>Give it to</span>' +
              '<select name="assigneeId"><option value="">' +
              'Anyone — put it in the pool</option>' + people +
              '</select></label>'
          : '') +
      '</form>',
      [
        { label: 'Cancel', kind: 'btn-secondary', act: closeModal },
        { label: editing ? 'Save' : 'Post it', kind: 'btn-primary',
          act: function (btn) {
            var f = $('chore-form');
            if (!f.reportValidity()) return;

            var payload = {
              title: f.title.value,
              notes: f.notes.value,
              category: f.category.value,
              dueDate: f.dueDate.value,
              recurrence: f.recurrence.value
            };
            payload.points = Number(f.points.value) || 0;
            if (f.assigneeId) payload.assigneeId = f.assigneeId.value;

            busy(btn, true);
            if (editing) {
              payload.choreId = c.choreId;
              run('updateChore', payload, 'Saved.')
                .then(function () { busy(btn, false); });
            } else {
              run('createChore', payload, 'Posted.')
                .then(function () { busy(btn, false); });
            }
          } }
      ]);

    var form = $('chore-form');
    var chips = $('point-chips');
    var custom = $('point-custom');

    chips.addEventListener('click', function (e) {
      var b = e.target.closest('[data-points]');
      if (!b) return;

      chips.querySelectorAll('.chip-pick').forEach(function (x) {
        x.classList.remove('on');
      });
      b.classList.add('on');

      if (b.dataset.points === 'custom') {
        custom.hidden = false;
        custom.focus();
        form.points.value = Number(custom.value) || 0;
      } else {
        custom.hidden = true;
        form.points.value = b.dataset.points;
      }
    });

    custom.addEventListener('input', function () {
      var v = Math.max(0, Math.min(999, Math.round(Number(custom.value) || 0)));
      form.points.value = v;
    });

    // Picking a ready-made chore fills the rest of the form in. Everything it
    // sets stays editable -- it is a starting point, not a template.
    //
    // Fires on 'input' rather than 'change' because a datalist pick and a
    // typed word are the same event; matching the exact title is what tells
    // them apart. Typing a name that is not on the list changes nothing else.
    form.title.addEventListener('input', function () {
      var typed = form.title.value.trim().toLowerCase();
      var hit = null;

      for (var i = 0; i < state.suggestions.length; i++) {
        if (String(state.suggestions[i].title).toLowerCase() === typed) {
          hit = state.suggestions[i];
          break;
        }
      }
      if (!hit) return;

      form.notes.value = hit.notes || '';
      form.category.value = hit.category || '';
      form.recurrence.value = hit.recurrence || '';

      var p = Number(hit.points) || 0;
      form.points.value = p;

      // Reflect the filled-in value on the chips, choosing Custom when the
      // suggestion's points are not one of the presets.
      var preset = state.pointPresets.indexOf(p) >= 0 || p === 0;
      chips.querySelectorAll('.chip-pick').forEach(function (x) {
        var on = preset ? Number(x.dataset.points) === p
                        : x.dataset.points === 'custom';
        x.classList.toggle('on', on);
      });
      custom.hidden = preset;
      if (!preset) custom.value = p;

      var hint = $('sugg-hint');
      if (hint) hint.textContent = 'Filled in from “' + hit.title +
                                   '”. Change anything you like.';
    });
  }

  // --- Give a chore to somebody -------------------------------------

  function assignForm(c) {
    if (!c) return;
    openModal('Give “' + esc(c.title) + '” to',
      '<div class="member-grid" id="assign-grid">' +
        state.members.map(function (m) {
          return '<button class="member-tile" data-assign="' + esc(m.memberId) + '">' +
                   '<span class="avatar" style="background:' + esc(m.color) + '">' +
                     esc(initials(m.name)) + '</span>' +
                   '<span class="name">' + esc(m.name) + '</span>' +
                 '</button>';
        }).join('') +
      '</div>',
      [{ label: 'Cancel', kind: 'btn-secondary', act: closeModal }]);

    $('assign-grid').addEventListener('click', function (e) {
      var t = e.target.closest('[data-assign]');
      if (!t) return;
      run('assignChore', { choreId: c.choreId, assigneeId: t.dataset.assign },
          'Handed over.');
    });
  }

  // --- Send a chore back --------------------------------------------

  function sendBackForm(c) {
    if (!c) return;
    openModal('Send back “' + esc(c.title) + '”',
      '<form class="form" id="back-form">' +
        '<label class="field"><span>What still needs doing?</span>' +
          '<textarea name="note" maxlength="500" ' +
                    'placeholder="The corners were missed."></textarea>' +
          '<small>They will see this on the chore.</small></label>' +
      '</form>',
      [
        { label: 'Cancel', kind: 'btn-secondary', act: closeModal },
        { label: 'Send back', kind: 'btn-warn', act: function (btn) {
            busy(btn, true);
            run('sendBackChore',
                { choreId: c.choreId, note: $('back-form').note.value },
                'Sent back.').then(function () { busy(btn, false); });
          } }
      ]);
  }

  // --- Manage sub-accounts ------------------------------------------

  function accountsForm() {
    var len = CONFIG_CLIENT.pinLength;

    function rows() {
      return state.members.map(function (m) {
        return '<div class="roster-row" data-row="' + esc(m.memberId) + '">' +
          '<span class="avatar" style="background:' + esc(m.color) +
                 ';width:2.2rem;height:2.2rem;font-size:0.9rem">' +
            esc(initials(m.name)) + '</span>' +
          '<span class="who">' + esc(m.name) +
            '<span class="sub"><br>' +
              (m.role === 'owner' ? 'Account holder'
                : m.canApprove ? 'Parent' : 'Member') +
              (m.hasPin ? ' · has a PIN' : ' · no PIN') +
              ' · ' + (m.points || 0) + 'p' +
              // Only worth showing when it differs -- otherwise it is noise.
              (m.realName && m.realName !== m.name
                ? ' · really ' + esc(m.realName) : '') +
            '</span>' +
          '</span>' +
          '<button class="btn btn-sm btn-secondary" data-points="' +
            esc(m.memberId) + '">Points</button>' +
          '<button class="btn btn-sm btn-secondary" data-edit="' +
            esc(m.memberId) + '">Edit</button>' +
        '</div>';
      }).join('');
    }

    openModal('Accounts in ' + esc(state.household ? state.household.name : ''),
      '<div class="roster" id="roster">' + rows() + '</div>' +
      '<hr style="margin:1rem 0;border:none;border-top:1px solid var(--line)">' +
      '<form class="form" id="add-form">' +
        '<label class="field"><span>Add somebody</span>' +
          '<input name="name" placeholder="Name" maxlength="40" /></label>' +
        '<label class="field"><span>PIN <small>(optional, ' + len +
          ' digits)</small></span>' +
          '<input name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="' +
            len + '" placeholder="Leave blank for none" /></label>' +
        '<label class="field"><span>Can they approve chores?</span>' +
          '<select name="role">' +
            '<option value="member">No — they do chores</option>' +
            '<option value="approver">Yes — a parent account</option>' +
          '</select></label>' +
      '</form>',
      [
        { label: 'Done', kind: 'btn-secondary', act: closeModal },
        { label: 'Add', kind: 'btn-primary', act: function (btn) {
            var f = $('add-form');
            if (!f.name.value.trim()) { toast('Enter a name.', 'bad'); return; }
            busy(btn, true);
            api('addMember', {
              name: f.name.value,
              pin: f.pin.value,
              role: f.role.value
            }).then(function (data) {
              state.members = data.members;
              $('roster').innerHTML = rows();
              f.reset();
              renderApp();
              toast('Added.', 'good');
            }).catch(fail).then(function () { busy(btn, false); });
          } }
      ]);

    $('roster').addEventListener('click', function (e) {
      var ed = e.target.closest('[data-edit]');
      var pt = e.target.closest('[data-points]');
      var id = (ed && ed.dataset.edit) || (pt && pt.dataset.points);
      if (!id) return;

      var m = state.members.filter(function (x) {
        return x.memberId === id;
      })[0];
      if (!m) return;

      if (pt) pointsForm(m); else memberForm(m);
    });
  }

  function memberForm(m) {
    var len = CONFIG_CLIENT.pinLength;
    var isOwner = m.role === 'owner';

    openModal('Edit ' + esc(m.name),
      '<form class="form" id="member-form">' +
        '<label class="field"><span>Display name</span>' +
          '<input name="name" value="' + esc(m.name) + '" maxlength="40" />' +
          '<small>What everybody sees on the board' +
            (isOwner ? ' — “Dad” works as well as your own name.' : '.') +
          '</small></label>' +

        // The account holder's real name is kept on file separately, so the
        // board can say "Dad" without the account itself losing track of who
        // it belongs to.
        (isOwner
          ? '<label class="field"><span>Real name</span>' +
              '<input name="realName" value="' + esc(m.realName || m.name) +
              '" maxlength="40" />' +
              '<small>Kept on file, never shown on the board.</small></label>'
          : '') +

        '<label class="field"><span>New PIN <small>(' + len +
          ' digits)</small></span>' +
          '<input name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="' +
            len + '" placeholder="' +
            (m.hasPin ? 'Leave blank to keep the current one' : 'No PIN set') +
            '" />' +
          (isOwner
            ? '<small>Stops anyone else opening the board as you.</small>'
            : '') +
        '</label>' +

        // Role and switching off are meaningless for the account holder --
        // there is nobody left to hand the household to.
        (isOwner ? ''
          : '<label class="field"><span>Can they approve chores?</span>' +
              '<select name="role">' +
                '<option value="member"' + (m.canApprove ? '' : ' selected') +
                  '>No — they do chores</option>' +
                '<option value="approver"' + (m.canApprove ? ' selected' : '') +
                  '>Yes — a parent account</option>' +
              '</select></label>') +

        (m.hasPin
          ? '<label class="field" style="flex-direction:row;align-items:center;' +
            'gap:0.5rem"><input type="checkbox" name="clearPin" ' +
            'style="width:auto"><span>Remove their PIN</span></label>'
          : '') +
      '</form>',
      [
        { label: 'Cancel', kind: 'btn-secondary', act: function () {
            accountsForm();
          } }
      ].concat(isOwner ? [] : [
        { label: 'Turn off', kind: 'btn-danger', act: function () {
            confirmModal('Turn off ' + m.name + '?',
              'They disappear from the name list. Their finished chores stay.',
              'Turn off', function () {
                api('updateMember', { targetId: m.memberId, active: false })
                  .then(function (data) {
                    state.members = data.members;
                    renderApp();
                    accountsForm();
                    toast('Turned off.', 'good');
                  }).catch(fail);
              }, true);
          } }
      ]).concat([
        { label: 'Save', kind: 'btn-primary', act: function (btn) {
            var f = $('member-form');
            var payload = { targetId: m.memberId, name: f.name.value };

            // Role is absent from the owner's form, so only send it when the
            // form actually offered it -- otherwise the server would read
            // undefined as a demotion request and refuse.
            if (f.role) payload.role = f.role.value;
            if (f.realName) payload.realName = f.realName.value;

            // '' clears the PIN, a value sets it, absent leaves it alone.
            if (f.clearPin && f.clearPin.checked) payload.pin = '';
            else if (f.pin.value.trim()) payload.pin = f.pin.value.trim();

            // Clearing a lockout is a side effect of an edit, which is how a
            // forgotten PIN gets unstuck.
            payload.unlock = true;

            busy(btn, true);
            api('updateMember', payload).then(function (data) {
              state.members = data.members;
              // The owner may have just renamed themselves, so refresh who
              // the header thinks is signed in.
              return refresh();
            }).then(function () {
              accountsForm();
              toast('Saved.', 'good');
            }).catch(fail).then(function () { busy(btn, false); });
          } }
      ]));
  }

  // -----------------------------------------------------------------
  // The Prize Pen -- what the points are for
  // -----------------------------------------------------------------

  function storeForm() {
    api('loadStore', {}).then(renderStore).catch(fail);
  }

  function renderStore(st) {
    var shelf = st.prizes.length
      ? st.prizes.map(function (p) {
          var blocked = p.soldOut || !p.affordable;
          return '<div class="list-row prize' + (blocked ? ' cant' : '') + '">' +
            '<span class="grow"><span class="t">' + esc(p.name) + '</span>' +
              (p.notes ? '<br><span class="sub">' + esc(p.notes) + '</span>' : '') +
              (p.stock !== null
                ? '<br><span class="sub">' + p.stock + ' left</span>' : '') +
            '</span>' +
            '<span class="cost">' + p.cost + 'p</span>' +
            (p.soldOut
              ? '<span class="sold-out">Gone</span>'
              : '<button class="btn btn-sm ' +
                  (p.affordable ? 'btn-go' : 'btn-secondary') +
                  '" data-buy="' + esc(p.prizeId) + '"' +
                  (p.affordable ? '' : ' disabled') + '>' +
                  (p.affordable ? 'Get it' : 'Not enough') + '</button>') +
            (st.canManage
              ? '<button class="btn btn-sm btn-secondary" data-pedit="' +
                  esc(p.prizeId) + '">Edit</button>' +
                '<button class="btn btn-sm btn-quiet" data-pdel="' +
                  esc(p.prizeId) + '">Remove</button>'
              : '') +
          '</div>';
        }).join('')
      : '<p class="form-hint">Nothing in the pen yet.</p>';

    var claims = st.claims.length
      ? st.claims.map(function (r) {
          var cls = r.status === 'handed over' ? 'handed'
                  : r.status === 'cancelled' ? 'cancelled' : 'claimed';
          return '<div class="list-row">' +
            '<span class="grow"><span class="t">' + esc(r.name) + '</span>' +
              '<br><span class="sub">' + esc(r.memberName) + ' &middot; ' +
              r.cost + 'p</span></span>' +
            '<span class="claim-status ' + cls + '">' + esc(r.status) + '</span>' +
            (st.canFulfil && r.status === 'claimed'
              ? '<button class="btn btn-sm btn-go" data-fulfil="' +
                  esc(r.redemptionId) + '">Handed over</button>' +
                '<button class="btn btn-sm btn-quiet" data-cancel="' +
                  esc(r.redemptionId) + '">Refund</button>'
              : '') +
          '</div>';
        }).join('')
      : '<p class="form-hint">Nothing claimed yet.</p>';

    openModal(esc(st.name) +
        ' <span class="cost">' + st.myPoints + 'p</span>',
      '<div class="list-rows" id="shelf">' + shelf + '</div>' +
      (st.canManage
        ? '<hr class="hr">' +
          '<form class="form" id="prize-add">' +
            '<label class="field"><span>Add a prize</span>' +
              '<input name="name" maxlength="80" placeholder="Ice cream" /></label>' +
            '<div class="chips">' +
              '<input type="number" name="cost" min="0" placeholder="Cost" ' +
                     'style="max-width:7rem" />' +
              '<input type="number" name="stock" min="0" ' +
                     'placeholder="How many (blank = unlimited)" ' +
                     'style="max-width:14rem" />' +
            '</div>' +
          '</form>'
        : '') +
      '<div class="section-head"><h3>Claims</h3></div>' +
      '<div class="list-rows" id="claims">' + claims + '</div>',
      [{ label: 'Close', kind: 'btn-secondary', act: closeModal }]
        .concat(st.canManage ? [
          { label: 'Add prize', kind: 'btn-primary', act: function (btn) {
              var f = $('prize-add');
              if (!f.name.value.trim()) { toast('Name the prize.', 'bad'); return; }
              busy(btn, true);
              api('addPrize', {
                name: f.name.value,
                cost: f.cost.value,
                stock: f.stock.value
              }).then(function (data) {
                renderStore(data);
                toast('Added.', 'good');
              }).catch(fail).then(function () { busy(btn, false); });
            } }
        ] : []));

    $('shelf').addEventListener('click', function (e) {
      var buy = e.target.closest('[data-buy]');
      var ed = e.target.closest('[data-pedit]');
      var del = e.target.closest('[data-pdel]');

      if (buy) {
        var p = st.prizes.filter(function (x) {
          return x.prizeId === buy.dataset.buy;
        })[0];
        confirmModal('Spend ' + p.cost + ' points?',
          'You will have ' + (st.myPoints - p.cost) + ' left. A parent hands ' +
          'the prize over.',
          'Get it', function (b) {
            busy(b, true);
            api('redeemPrize', { prizeId: p.prizeId })
              .then(function (data) {
                renderStore(data);
                // The chip in the header carries the balance, so it has to
                // catch up too.
                return refresh();
              })
              .then(function () { toast('Claimed. Go and find a parent.', 'good'); })
              .catch(function (err) { fail(err); storeForm(); });
          });
        return;
      }
      if (del) {
        busy(del, true);
        api('removePrize', { prizeId: del.dataset.pdel })
          .then(renderStore).catch(fail);
        return;
      }
      if (ed) {
        var pr = st.prizes.filter(function (x) {
          return x.prizeId === ed.dataset.pedit;
        })[0];
        if (pr) prizeForm(pr);
      }
    });

    $('claims').addEventListener('click', function (e) {
      var ok = e.target.closest('[data-fulfil]');
      var no = e.target.closest('[data-cancel]');

      if (ok) {
        busy(ok, true);
        api('fulfilRedemption', { redemptionId: ok.dataset.fulfil })
          .then(function (data) { renderStore(data); toast('Marked.', 'good'); })
          .catch(fail);
      } else if (no) {
        busy(no, true);
        api('cancelRedemption', { redemptionId: no.dataset.cancel })
          .then(function (data) {
            renderStore(data);
            return refresh();
          })
          .then(function () { toast('Refunded.', 'good'); })
          .catch(fail);
      }
    });
  }

  function prizeForm(p) {
    openModal('Edit ' + esc(p.name),
      '<form class="form" id="prize-form">' +
        '<label class="field"><span>Prize</span>' +
          '<input name="name" value="' + esc(p.name) + '" maxlength="80" /></label>' +
        '<label class="field"><span>Cost in points</span>' +
          '<input type="number" name="cost" min="0" value="' + p.cost + '" /></label>' +
        '<label class="field"><span>How many</span>' +
          '<input type="number" name="stock" min="0" value="' +
            (p.stock === null ? '' : p.stock) + '" ' +
            'placeholder="Blank = unlimited" /></label>' +
        '<label class="field"><span>Details</span>' +
          '<textarea name="notes" maxlength="500">' + esc(p.notes || '') +
          '</textarea></label>' +
      '</form>',
      [
        { label: 'Back', kind: 'btn-secondary', act: storeForm },
        { label: 'Save', kind: 'btn-primary', act: function (btn) {
            var f = $('prize-form');
            busy(btn, true);
            api('updatePrize', {
              prizeId: p.prizeId,
              name: f.name.value,
              cost: f.cost.value,
              stock: f.stock.value,
              notes: f.notes.value
            }).then(function (data) {
              renderStore(data);
              toast('Saved.', 'good');
            }).catch(fail).then(function () { busy(btn, false); });
          } }
      ]);
  }

  // -----------------------------------------------------------------
  // Moving points by hand
  // -----------------------------------------------------------------

  /**
   * The account holder's override.
   *
   * Add, take away, or set outright. Chores and the store move points on
   * their own; this is for everything that happens off the board -- a bribe,
   * a forfeit, a correction after somebody miscounted.
   */
  function pointsForm(m) {
    openModal('Points for ' + esc(m.name),
      '<p class="form-hint" style="text-align:left">' +
        esc(m.name) + ' has <strong>' + (m.points || 0) + '</strong> points.' +
      '</p>' +
      '<form class="form" id="points-form">' +
        '<div class="field"><span>Add or take away</span>' +
          '<div class="chips" id="points-quick">' +
            [5, 10, 25, -5, -10, -25].map(function (n) {
              return '<button type="button" class="chip-pick" data-delta="' +
                n + '">' + (n > 0 ? '+' : '') + n + '</button>';
            }).join('') +
          '</div>' +
          '<input type="number" name="delta" placeholder="or type an amount" />' +
        '</div>' +
        '<label class="field"><span>Or set it to exactly</span>' +
          '<input type="number" name="set" min="0" placeholder="Leave blank to adjust" />' +
        '</label>' +
        '<label class="field"><span>Why <small>(optional)</small></span>' +
          '<input name="reason" maxlength="200" placeholder="Helped with the shopping" />' +
          '<small>Kept in the activity log, so the change can be explained later.</small>' +
        '</label>' +
      '</form>',
      [
        { label: 'Back', kind: 'btn-secondary', act: accountsForm },
        { label: 'Apply', kind: 'btn-primary', act: function (btn) {
            var f = $('points-form');
            var payload = { targetId: m.memberId, reason: f.reason.value };

            if (String(f.set.value).trim() !== '') payload.set = f.set.value;
            else payload.delta = f.delta.value;

            busy(btn, true);
            api('adjustPoints', payload).then(function (data) {
              state.members = data.members;
              return refresh();
            }).then(function () {
              accountsForm();
              toast('Points updated.', 'good');
            }).catch(fail).then(function () { busy(btn, false); });
          } }
      ]);

    $('points-quick').addEventListener('click', function (e) {
      var b = e.target.closest('[data-delta]');
      if (!b) return;
      var f = $('points-form');
      f.delta.value = b.dataset.delta;
      f.set.value = '';
      $('points-quick').querySelectorAll('.chip-pick').forEach(function (x) {
        x.classList.toggle('on', x === b);
      });
    });
  }

  // --- Change the household password ---------------------------------

  function passwordForm() {
    openModal('Change password',
      '<form class="form" id="pw-form">' +
        '<label class="field"><span>Current password</span>' +
          '<input type="password" name="currentPassword" ' +
                 'autocomplete="current-password" /></label>' +
        '<label class="field"><span>New password</span>' +
          '<input type="password" name="newPassword" ' +
                 'autocomplete="new-password" minlength="' +
                 CONFIG_CLIENT.minPassword + '" />' +
          '<small>At least ' + CONFIG_CLIENT.minPassword +
          ' characters. Every other device gets signed out.</small></label>' +
      '</form>',
      [
        { label: 'Cancel', kind: 'btn-secondary', act: closeModal },
        { label: 'Change it', kind: 'btn-primary', act: function (btn) {
            var f = $('pw-form');
            busy(btn, true);
            api('changeHouseholdPassword', {
              currentPassword: f.currentPassword.value,
              newPassword: f.newPassword.value
            }).then(function () {
              closeModal();
              toast('Password changed.', 'good');
            }).catch(fail).then(function () { busy(btn, false); });
          } }
      ]);
  }

  // -----------------------------------------------------------------
  // Start
  // -----------------------------------------------------------------

  function paintArt() {
    ['splash-logo', 'gate-logo', 'header-logo'].forEach(function (id) {
      var el = $(id);
      if (el && typeof ART !== 'undefined' && ART.LOGO) {
        el.style.backgroundImage = 'url("' + ART.LOGO + '")';
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    paintArt();
    wireGate();
    wirePicker();
    wireApp();

    // Tokens first: boot() decides which screen to show from them, so asking
    // the wrapper afterwards would flash the sign-in form at somebody who is
    // already signed in.
    loadTokens(function () {
      boot();

      // The wrapper's storage is what counts when there is a wrapper, so only
      // complain about this frame's storage when we are relying on it.
      if (!bridge.ready && !store.durable) {
        setTimeout(function () {
          toast('This browser will not remember you between visits.');
        }, 1200);
      }
    });
  });
})();
</script>
