<script>
/* ===================================================================
   Chore Boar -- the whole client.
   An Apps Script web app serves no static files, so this is one classic
   script rather than the ES modules the old build used. No import/export:
   relative module paths cannot resolve inside the HtmlService sandbox.
   =================================================================== */
(function () {
  'use strict';

  // -----------------------------------------------------------------
  // Remembering the device
  // -----------------------------------------------------------------

  /**
   * localStorage, with a memory fallback.
   *
   * The app runs in an iframe on a googleusercontent.com origin, which makes
   * it third-party storage. Safari's tracking prevention blocks that outright,
   * and so does any browser set to refuse third-party cookies -- and a bare
   * localStorage read there THROWS rather than returning null. Falling back to
   * memory costs those users a sign-in per visit instead of a broken app.
   */
  var store = (function () {
    var mem = {};
    var ok = false;
    try {
      window.localStorage.setItem('cb.probe', '1');
      window.localStorage.removeItem('cb.probe');
      ok = true;
    } catch (e) {
      ok = false;
    }
    return {
      durable: ok,
      get: function (k) {
        try { return ok ? window.localStorage.getItem(k) : (mem[k] || null); }
        catch (e) { return mem[k] || null; }
      },
      set: function (k, v) {
        try { if (ok) window.localStorage.setItem(k, v); else mem[k] = v; }
        catch (e) { mem[k] = v; }
      },
      del: function (k) {
        try { if (ok) window.localStorage.removeItem(k); delete mem[k]; }
        catch (e) { delete mem[k]; }
      }
    };
  })();

  /**
   * The bridge to the wrapper page at the custom domain.
   *
   * Apps Script serves this app from a *.googleusercontent.com frame. Framed
   * again under thechoreboar.fyi, that frame is third-party and Safari will
   * not let it keep localStorage -- measured, not guessed: cloaked forwarding
   * asked for the password on every visit.
   *
   * So when we are inside our own wrapper, the wrapper holds the tokens in
   * ITS first-party storage and we talk to it over postMessage, which is not
   * storage-gated. Opened directly at the /exec URL there is no wrapper, and
   * localStorage is used exactly as before.
   */
  var bridge = { ready: false, win: null, origin: null };

  var cache = { household: '', member: '' };

  var TOKENS = {
    get household() { return cache.household; },
    set household(v) { cache.household = v || ''; persistTokens(); },
    get member() { return cache.member; },
    set member(v) { cache.member = v || ''; persistTokens(); }
  };

  function persistTokens() {
    if (bridge.ready) {
      bridge.win.postMessage({
        cb: 'save',
        household: cache.household,
        member: cache.member
      }, bridge.origin);
      return;
    }
    cache.household ? store.set('cb.householdToken', cache.household)
                    : store.del('cb.householdToken');
    cache.member ? store.set('cb.memberToken', cache.member)
                 : store.del('cb.memberToken');
  }

  /** Origins we will hand a live session to. Nothing else, ever. */
  function trustedWrapper(origin) {
    for (var i = 0; i < CONFIG_CLIENT.wrapperOrigins.length; i++) {
      if (CONFIG_CLIENT.wrapperOrigins[i] === origin) return true;
    }
    return false;
  }

  /**
   * Loads the tokens, then calls done().
   *
   * Asks the wrapper first and waits briefly; falls back to localStorage if
   * there is no wrapper or it does not answer. Either way done() runs exactly
   * once, so a silent wrapper delays start-up rather than hanging it.
   */
  function loadTokens(done) {
    function fromStore() {
      cache.household = store.get('cb.householdToken') || '';
      cache.member = store.get('cb.memberToken') || '';
    }

    // Not framed: nothing to talk to.
    if (window.top === window.self) { fromStore(); done(); return; }

    var settled = false;
    var finish = function () {
      if (settled) return;
      settled = true;
      window.removeEventListener('message', onMessage);
      done();
    };

    function onMessage(e) {
      if (settled) return;
      if (!trustedWrapper(e.origin) || !e.data || e.data.cb !== 'tokens') return;

      bridge.ready = true;
      bridge.win = e.source;
      bridge.origin = e.origin;
      cache.household = String(e.data.household || '');
      cache.member = String(e.data.member || '');
      finish();
    }

    window.addEventListener('message', onMessage);

    // '*' only for this opening hello, which carries nothing. Every reply is
    // checked against the allow-list before we trust it, and every token we
    // send afterwards goes to that verified origin by name.
    try {
      window.top.postMessage({ cb: 'hello' }, '*');
    } catch (err) {
      fromStore(); finish(); return;
    }

    setTimeout(function () {
      if (settled) return;
      // Framed by something that is not our wrapper -- an unmasked deployment
      // in an iframe, say. Behave as before.
      fromStore();
      finish();
    }, 900);
  }

  // -----------------------------------------------------------------
  // Talking to the server
  // -----------------------------------------------------------------

  /**
   * One call, one shape. Tokens ride along on every request so the server
   * decides what the caller may do -- the client never decides for itself.
   */
  /**
   * How many calls are in the air.
   *
   * Apps Script round-trips are slow enough -- often a second or two -- that
   * without a visible sign of life people tap Claim again, and again. A
   * counter rather than a boolean because two calls can overlap, and the bar
   * must not vanish when the first of them lands.
   */
  var inFlight = 0;

  function setBusy(delta) {
    inFlight = Math.max(0, inFlight + delta);
    var bar = $('progress');
    if (bar) bar.hidden = inFlight === 0;
  }

  function api(action, payload) {
    var body = payload || {};
    body.householdToken = TOKENS.household;
    body.memberToken = TOKENS.member;

    setBusy(1);
    var done = function () { setBusy(-1); };

    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (res) {
          done();
          if (res && res.ok) { resolve(res.data); return; }
          var msg = (res && res.error) || 'Something went wrong.';
          if (msg === 'SIGNED_OUT') {
            // The token lapsed under us. Back to whichever screen fits.
            TOKENS.member = '';
            boot();
            reject(new Error('SIGNED_OUT'));
            return;
          }
          reject(new Error(msg));
        })
        .withFailureHandler(function (err) {
          done();
          reject(new Error(
            (err && err.message) ||
            'Could not reach the server. Check your connection.'));
        })
        .call(action, body);
    });
  }

  // -----------------------------------------------------------------
  // State
  // -----------------------------------------------------------------

  var state = {
    household: null,
    members: [],
    me: null,
    chores: [],
    categories: [],
    pointPresets: [],
    suggestions: [],
    tab: 'community-pool',
    query: ''
  };

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/);
    return ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : ''))
      .toUpperCase();
  }

  // -----------------------------------------------------------------
  // Toast
  // -----------------------------------------------------------------

  var toastTimer = null;

  function toast(msg, kind) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 3600);
  }

  function fail(err) {
    if (err && err.message === 'SIGNED_OUT') return;
    toast((err && err.message) || String(err), 'bad');
  }

  /**
   * Puts a button into its waiting state.
   *
   * The label is kept and hidden rather than replaced, so the button holds
   * its width and the row does not jump about while it spins.
   */
  function busy(btn, on) {
    if (!btn) return;
    btn.disabled = !!on;
    btn.classList.toggle('is-busy', !!on);
  }

  /** Dims a whole chore card while one of its buttons is working. */
  function busyCard(el, on) {
    if (el) el.classList.toggle('is-busy', !!on);
  }

  /**
   * A blocking overlay for the jobs that rebuild the whole board.
   *
   * Filling the trough writes a row per chore, which on a long list is slow
   * enough that the board looks frozen. Better to say what is happening.
   */
  function working(message) {
    var host = $('app');
    var el = document.createElement('div');
    el.className = 'working';
    el.innerHTML = '<div class="spinner"></div><div>' + esc(message) + '</div>';
    host.appendChild(el);
    return function () { if (el.parentNode) el.parentNode.removeChild(el); };
  }

  // -----------------------------------------------------------------
  // Screens
  // -----------------------------------------------------------------

  function show(which) {
    ['splash', 'gate', 'picker', 'app'].forEach(function (id) {
      $(id).hidden = (id !== which);
    });
  }

  /** Decides which screen to show, from whatever the device remembered. */
  function boot() {
    show('splash');
    api('resumeSession', {})
      .then(function (data) {
        if (!data.signedIn) {
          TOKENS.household = '';
          TOKENS.member = '';
          show('gate');
          return;
        }
        state.household = data.household;
        state.members = data.members || [];

        if (data.me) {
          state.me = data.me;
          return refresh().then(function () { show('app'); });
        }
        renderPicker();
        show('picker');
      })
      .catch(function (err) {
        if (err && err.message === 'SIGNED_OUT') return;
        show('gate');
        toast(err.message, 'bad');
      });
  }

  // -----------------------------------------------------------------
  // Screen 1 -- sign in / create household
  // -----------------------------------------------------------------

  function wireGate() {
    var signinBtn = $('seg-signin');
    var createBtn = $('seg-create');

    function pick(which) {
      var isSignin = which === 'signin';
      signinBtn.classList.toggle('active', isSignin);
      createBtn.classList.toggle('active', !isSignin);
      signinBtn.setAttribute('aria-selected', String(isSignin));
      createBtn.setAttribute('aria-selected', String(!isSignin));
      $('form-signin').hidden = !isSignin;
      $('form-create').hidden = isSignin;
    }

    signinBtn.addEventListener('click', function () { pick('signin'); });
    createBtn.addEventListener('click', function () { pick('create'); });

    $('form-signin').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target;
      var btn = f.querySelector('button[type=submit]');
      var err = $('signin-error');
      err.hidden = true;
      busy(btn, true);

      api('signInHousehold', {
        email: f.email.value,
        password: f.password.value,
        deviceLabel: deviceLabel()
      }).then(function (data) {
        TOKENS.household = data.householdToken;
        TOKENS.member = '';
        state.household = data.household;
        state.members = data.members || [];
        f.password.value = '';
        renderPicker();
        show('picker');
      }).catch(function (e2) {
        err.textContent = e2.message;
        err.hidden = false;
      }).then(function () { busy(btn, false); });
    });

    $('form-create').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target;
      var btn = f.querySelector('button[type=submit]');
      var err = $('create-error');
      err.hidden = true;
      busy(btn, true);

      api('createHousehold', {
        householdName: f.householdName.value,
        ownerName: f.ownerName.value,
        email: f.email.value,
        password: f.password.value,
        deviceLabel: deviceLabel()
      }).then(function (data) {
        TOKENS.household = data.householdToken;
        TOKENS.member = '';
        state.household = data.household;
        state.members = data.members || [];
        f.password.value = '';
        renderPicker();
        show('picker');
        toast('Household created. Tap your name to start.', 'good');
      }).catch(function (e2) {
        err.textContent = e2.message;
        err.hidden = false;
      }).then(function () { busy(btn, false); });
    });
  }

  /** A rough name for this device, so the Sessions sheet is readable. */
  function deviceLabel() {
    var ua = navigator.userAgent || '';
    var kind = /iPhone|Android.*Mobile/.test(ua) ? 'Phone'
             : /iPad|Tablet/.test(ua) ? 'Tablet' : 'Computer';
    var os = /Windows/.test(ua) ? 'Windows'
           : /Mac OS X/.test(ua) ? 'Mac'
           : /Android/.test(ua) ? 'Android'
           : /iPhone|iPad|iPod/.test(ua) ? 'iOS' : '';
    return (os ? os + ' ' : '') + kind;
  }

  // -----------------------------------------------------------------
  // Screen 2 -- who is using this device
  // -----------------------------------------------------------------

  function renderPicker() {
    $('picker-household').textContent =
      state.household ? state.household.name : "Who's this?";

    $('member-grid').innerHTML = state.members.map(function (m) {
      return '' +
        '<button class="member-tile" data-member="' + esc(m.memberId) + '">' +
          '<span class="avatar" style="background:' + esc(m.color || '#02407d') + '">' +
            esc(initials(m.name)) +
          '</span>' +
          '<span class="name">' + esc(m.name) + '</span>' +
          (m.canApprove ? '<span class="role">Parent</span>' : '') +
          (m.hasPin ? '<span class="lock">PIN</span>' : '') +
        '</button>';
    }).join('');
  }

  function wirePicker() {
    $('member-grid').addEventListener('click', function (e) {
      var tile = e.target.closest('[data-member]');
      if (!tile) return;
      var id = tile.dataset.member;
      var m = state.members.filter(function (x) { return x.memberId === id; })[0];
      if (!m) return;

      if (m.hasPin) { askPin(m); return; }

      // Signing somebody in is two server round trips -- pickMember, then
      // the whole board -- which on a cold Apps Script container is seconds.
      // Without this the tile just sits there and people tap it again.
      pickerBusy(tile, true);
      enterAs(m.memberId, '').then(function () {
        pickerBusy(tile, false);
      });
    });

    $('picker-signout').addEventListener('click', function () {
      confirmModal(
        'Sign this device out?',
        'You will need the household email and password to get back in.',
        'Sign out',
        function () {
          api('signOutDevice', {}).then(function () {
            TOKENS.household = '';
            TOKENS.member = '';
            show('gate');
          }).catch(fail);
        });
    });
  }

  /**
   * Marks the tile being signed in to, and stops the rest of the grid being
   * tapped while it happens. The spinner is the tile's own, not the button
   * spinner, because the tile is a whole card rather than a label.
   */
  function pickerBusy(tile, on) {
    var grid = $('member-grid');
    if (grid) grid.classList.toggle('is-waiting', !!on);
    if (tile) tile.classList.toggle('is-busy', !!on);
  }

  /** Completes the pick and lands on the board. */
  function enterAs(memberId, pin, onError) {
    return api('pickMember', { memberId: memberId, pin: pin })
      .then(function (data) {
        TOKENS.member = data.memberToken;
        state.me = data.me;
        return refresh();
      })
      .then(function () {
        closeModal();
        show('app');
      })
      .catch(function (err) {
        if (onError) onError(err); else fail(err);
      });
  }

  /** The PIN pad. Deliberately big buttons -- children use this on a phone. */
  function askPin(member) {
    var len = CONFIG_CLIENT.pinLength;
    var entered = '';

    var keys = ['1','2','3','4','5','6','7','8','9','back','0','go'];

    openModal(
      esc(member.name),
      '<p class="form-hint" style="text-align:center">Enter your PIN</p>' +
      '<div class="pin-dots" id="pin-dots"></div>' +
      '<p class="form-error" id="pin-error" role="alert" hidden></p>' +
      '<div class="pin-pad">' +
        keys.map(function (k) {
          if (k === 'back') return '<button class="pin-key wide" data-pin="back">⌫</button>';
          if (k === 'go') return '<button class="pin-key wide" data-pin="go">OK</button>';
          return '<button class="pin-key" data-pin="' + k + '">' + k + '</button>';
        }).join('') +
      '</div>',
      [{ label: 'Cancel', kind: 'btn-secondary', act: closeModal }]
    );

    function paint() {
      var dots = [];
      for (var i = 0; i < len; i++) {
        dots.push('<span class="pin-dot' + (i < entered.length ? ' filled' : '') + '"></span>');
      }
      $('pin-dots').innerHTML = dots.join('');
    }
    paint();

    var checking = false;

    function submit() {
      if (checking || entered.length !== len) return;
      var err = $('pin-error');
      err.hidden = true;

      // The PIN itself is checked server-side -- 2000 HMAC rounds plus the
      // board load -- so OK has a real wait behind it. Lock the pad and say
      // so, or it reads as a dead button and people hammer it.
      checking = true;
      padBusy(true);

      enterAs(member.memberId, entered, function (e) {
        checking = false;
        padBusy(false);
        entered = '';
        paint();
        err.textContent = e.message;
        err.hidden = false;
      });
    }

    function padBusy(on) {
      var pad = document.querySelector('.pin-pad');
      if (pad) pad.classList.toggle('is-checking', !!on);
      var go = document.querySelector('[data-pin="go"]');
      if (go) go.classList.toggle('is-busy', !!on);
      var dots = $('pin-dots');
      if (dots) dots.classList.toggle('is-checking', !!on);
    }

    document.querySelector('.pin-pad').addEventListener('click', function (e) {
      var k = e.target.closest('[data-pin]');
      if (!k) return;
      var v = k.dataset.pin;

      if (v === 'back') entered = entered.slice(0, -1);
      else if (v === 'go') { submit(); return; }
      else if (entered.length < len) entered += v;

      paint();
      // Filling the last digit submits, so nobody has to find OK.
      if (entered.length === len) submit();
    });

    // A physical keyboard should work too.
    var onKey = function (e) {
      if (/^[0-9]$/.test(e.key)) {
        if (entered.length < len) { entered += e.key; paint(); }
        if (entered.length === len) submit();
      } else if (e.key === 'Backspace') {
        entered = entered.slice(0, -1); paint();
      } else if (e.key === 'Enter') { submit(); }
    };
    document.addEventListener('keydown', onKey);
    modalCleanup = function () { document.removeEventListener('keydown', onKey); };
  }

  // -----------------------------------------------------------------
  // Screen 3 -- the board
  // -----------------------------------------------------------------

  /** Pulls the whole board and repaints. */
  function refresh() {
    return api('loadBoard', {}).then(applyBoard);
  }

  function applyBoard(data) {
    state.me = data.me;
    state.members = data.members || [];
    state.chores = data.chores || [];
    state.categories = data.categories || [];
    state.pointPresets = data.pointPresets || [];
    state.suggestions = data.suggestions || [];
    renderApp();
    return data;
  }

  function renderApp() {
    $('header-household').textContent =
      state.household ? state.household.name : '';

    var me = state.me || {};
    $('chip-dot').style.background = me.color || '#02407d';
    $('chip-dot').textContent = initials(me.name);
    $('chip-name').textContent = me.name || '';
    $('chip-points').textContent = (me.points || 0) + 'p';

    // Managing accounts is the account holder's alone -- a second parent can
    // approve chores without being able to rename a child or reset a PIN.
    var isOwner = me.role === 'owner';
    document.querySelectorAll('[data-menu=accounts]').forEach(function (b) {
      b.hidden = !isOwner;
    });
    document.querySelectorAll('[data-menu=password]').forEach(function (b) {
      b.hidden = !isOwner;
    });

    // Only parents post chores, so the add button is theirs alone. The server
    // refuses either way; this stops a child being shown a button that fails.
    $('new-chore').hidden = !me.canApprove;

    // The Trough is read-only for a child -- a list they cannot add to or
    // hand out -- so it is not worth a menu entry. The Prize Pen stays: that
    // one is mostly for them.
    document.querySelectorAll('[data-menu=trough],[data-menu=sty]')
      .forEach(function (b) { b.hidden = !me.canApprove; });

    // The strip is static markup, so its label has to be updated by hand.
    var claimedTab = $('my-chores');
    if (claimedTab) {
      var badge = claimedTab.querySelector('.tab-count');
      claimedTab.textContent = me.canApprove ? 'Claimed ' : 'My Chores ';
      claimedTab.appendChild(badge);
    }

    renderCounts();
    renderContent();
  }

  // --- Tab bucketing ------------------------------------------------

  /**
   * Which tab a chore belongs on for the person looking at it.
   *
   * A parent sees everybody's work in progress and everything awaiting
   * approval; anyone else sees only their own. Done is shared -- the point of
   * a household board is that finished work is visible.
   */
  /**
   * The chores belonging on one tab.
   *
   * No visibility rule here any more -- the server decides what reaches this
   * browser, so anything in state.chores is already something this person is
   * allowed to see. A parent therefore gets their own AND every child's,
   * which is the point: they can follow who has what and where it has got to.
   *
   * Own chores sort first, so a parent's list opens on their own work rather
   * than making them hunt for it among the children's.
   */
  function choresFor(tabId) {
    var me = state.me || {};

    var list = state.chores.filter(function (c) {
      switch (tabId) {
        case 'community-pool':     return c.status === 'pool';
        case 'my-chores':          return c.status === 'claimed';
        case 'in-progress':        return c.status === 'in_progress';
        case 'ready-for-approval': return c.status === 'submitted';
        case 'done':               return c.status === 'done';
        default: return false;
      }
    });

    if (!me.canApprove) return list;

    return list.slice().sort(function (a, b) {
      var am = a.assigneeId === me.memberId ? 0 : 1;
      var bm = b.assigneeId === me.memberId ? 0 : 1;
      return am - bm;
    });
  }

  /** The five tabs, in order, with the label each one shows. */
  function tabList() {
    // A parent sees the children's claimed chores in this tab as well as
    // their own, so "My Chores" would be a lie. Children see only their own,
    // where it is exactly right.
    var claimedLabel = (state.me && state.me.canApprove) ? 'Claimed' : 'My Chores';

    return [
      { id: 'community-pool',     label: 'Community Pool' },
      { id: 'my-chores',          label: claimedLabel },
      { id: 'in-progress',        label: 'In Progress' },
      { id: 'ready-for-approval', label: 'Ready for Approval' },
      { id: 'done',               label: 'Done' }
    ];
  }

  function renderCounts() {
    var boss = !!(state.me && state.me.canApprove);

    tabList().forEach(function (t) {
      var n = choresFor(t.id).length;
      var badge = $(t.id).querySelector('.tab-count');
      badge.textContent = n;
      badge.classList.toggle('show', n > 0);
      // Approvals are the one queue somebody is actively waiting on.
      badge.classList.toggle(
        'alert', t.id === 'ready-for-approval' && n > 0 && boss);
    });

    renderTabMenu();
  }

  /**
   * The narrow-screen dropdown.
   *
   * Rebuilt from the same counts as the strip rather than kept in its own
   * state, so the two can never disagree about which tab is active.
   */
  function renderTabMenu() {
    var current = tabList().filter(function (t) {
      return t.id === state.tab;
    })[0] || tabList()[0];

    $('tab-menu-label').textContent = current.label;

    $('tab-menu-list').innerHTML = tabList().map(function (t) {
      var n = choresFor(t.id).length;
      return '<button data-goto="' + t.id + '"' +
             (t.id === state.tab ? ' class="on"' : '') + '>' +
               '<span>' + esc(t.label) + '</span>' +
               (n ? '<span class="n">' + n + '</span>' : '') +
             '</button>';
    }).join('');
  }

  /** Moves to a tab from either control. */
  function selectTab(id) {
    state.tab = id;
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.id === id);
      t.setAttribute('aria-selected', String(t.id === id));
    });
    renderTabMenu();
    renderContent();
    $('content-field').scrollTop = 0;
  }

  function matchesQuery(c) {
    if (!state.query) return true;
    var q = state.query.toLowerCase();
    return [c.title, c.notes, c.category, c.assigneeName, c.createdByName]
      .join(' ').toLowerCase().indexOf(q) >= 0;
  }

  function renderContent() {
    var list = choresFor(state.tab).filter(matchesQuery);
    var field = $('content-field');

    if (!list.length) {
      field.innerHTML = '<div class="chore-list">' + emptyState() + '</div>';
      return;
    }
    field.innerHTML = '<div class="chore-list">' +
      list.map(choreCard).join('') + '</div>';
  }

  function emptyState() {
    var boss = !!(state.me && state.me.canApprove);
    if (state.query) {
      return '<div class="empty"><h2>Nothing matches</h2>' +
             '<p>No chore here mentions “' + esc(state.query) + '”.</p></div>';
    }
    var copy = {
      'community-pool': ['The pool is empty',
                         'Nothing is going spare. Add a chore with the + button.'],
      'my-chores': boss
        ? ['Nothing claimed', 'Chores that have been taken but not started.']
        : ['You have not claimed anything',
           'Take something from the Community Pool.'],
      'in-progress': boss
        ? ['Nothing on the go', 'Chores anybody has started show up here.']
        : ['Nothing on the go', 'Chores you have started show up here.'],
      'ready-for-approval': ['Nothing waiting',
                             'Finished chores land here for a parent to approve.'],
      'done': ['Nothing finished yet', 'Approved chores are kept here.']
    }[state.tab] || ['Nothing here', ''];

    return '<div class="empty"><h2>' + esc(copy[0]) + '</h2>' +
           '<p>' + esc(copy[1]) + '</p></div>';
  }

  // --- One chore ----------------------------------------------------

  function choreCard(c) {
    var me = state.me || {};
    var mine = c.assigneeId === me.memberId;

    var meta = [];
    if (c.category) meta.push('<span class="pill">' + esc(c.category) + '</span>');
    if (c.assigneeName) {
      meta.push('<span class="pill who" style="background:' +
                esc(c.assigneeColor || '#02407d') + '">' +
                esc(c.assigneeName) + '</span>');
    }
    if (c.dueDate) {
      meta.push('<span class="pill ' + (c.overdue ? 'late' : 'due') + '">' +
                (c.overdue ? 'Overdue ' : 'Due ') + esc(prettyDate(c.dueDate)) +
                '</span>');
    }
    if (c.recurrence) {
      meta.push('<span class="pill rep">' + esc(c.recurrence) + '</span>');
    }
    if (c.status === 'done' && c.approvedByName) {
      meta.push('<span class="pill">OK’d by ' + esc(c.approvedByName) + '</span>');
    }

    if (c.source === 'trough') {
      meta.push('<span class="pill src">The Trough</span>');
    } else if (c.source === 'sty') {
      meta.push('<span class="pill src">The Sty</span>');
    }

    return '' +
      '<article class="chore s-' + esc(c.status) + (c.overdue ? ' overdue' : '') +
              '" data-chore="' + esc(c.choreId) + '">' +
        '<div class="chore-top">' +
          '<h3 class="chore-title">' +
            // The reference makes two identical titles tellable apart out
            // loud -- "have you done 42?" -- without anybody reading an id.
            (c.ref ? '<span class="chore-ref">#' + c.ref + '</span> ' : '') +
            esc(c.title) + '</h3>' +
          (c.points ? '<span class="chore-points">' + c.points + 'p</span>' : '') +
        '</div>' +
        (c.notes ? '<p class="chore-notes">' + esc(c.notes) + '</p>' : '') +
        (meta.length ? '<div class="chore-meta">' + meta.join('') + '</div>' : '') +
        (c.reviewNote
          ? '<p class="chore-note-back"><strong>Sent back:</strong> ' +
            esc(c.reviewNote) + '</p>'
          : '') +
        '<div class="chore-actions">' + actionsFor(c, me, mine) + '</div>' +
      '</article>';
  }

  function btn(act, label, kind) {
    return '<button class="btn btn-sm ' + kind + '" data-act="' + act + '">' +
           esc(label) + '</button>';
  }

  function actionsFor(c, me, mine) {
    var out = [];
    var boss = !!me.canApprove;

    if (c.status === 'pool') {
      out.push(btn('claim', 'Claim', 'btn-go'));
      if (boss) out.push(btn('assign', 'Give to…', 'btn-secondary'));
    } else if (c.status === 'claimed' && (mine || boss)) {
      out.push(btn('start', 'Start', 'btn-primary'));
      out.push(btn('submit', 'Mark done', 'btn-go'));
      // A Trough or Sty chore was handed out deliberately, so it cannot be
      // dropped back in the pool for somebody else to pick up. A parent moves
      // it with "Give to" instead. The server refuses either way.
      if (c.source === 'pool') out.push(btn('release', 'Put back', 'btn-secondary'));
      else if (boss) out.push(btn('assign', 'Give to…', 'btn-secondary'));
    } else if (c.status === 'in_progress' && (mine || boss)) {
      out.push(btn('submit', 'Mark done', 'btn-go'));
      out.push(btn('pause', 'Pause', 'btn-secondary'));
      if (c.source !== 'pool' && boss) out.push(btn('assign', 'Give to…', 'btn-secondary'));
    } else if (c.status === 'submitted') {
      if (boss) {
        out.push(btn('approve', 'Approve', 'btn-go'));
        out.push(btn('sendback', 'Send back', 'btn-warn'));
      } else {
        out.push('<span class="pill">Waiting for a parent</span>');
      }
    } else if (c.status === 'done' && boss) {
      out.push(btn('reopen', 'Do it again', 'btn-secondary'));
    }

    // Editing: a parent always; anyone else only their own, still in the pool.
    var canEdit = boss ||
                  (c.createdBy === me.memberId && c.status === 'pool');
    if (canEdit && c.status !== 'done') {
      out.push(btn('edit', 'Edit', 'btn-secondary'));
    }
    if (canEdit) out.push(btn('delete', 'Delete', 'btn-quiet'));

    return out.join('');
  }

  function prettyDate(iso) {
    var d = new Date(iso + 'T12:00:00');
    if (isNaN(d.getTime())) return iso;
    var today = new Date(); today.setHours(12, 0, 0, 0);
    var days = Math.round((d - today) / 86400000);
    if (days === 0) return 'today';
    if (days === 1) return 'tomorrow';
    if (days === -1) return 'yesterday';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // --- Board interactions -------------------------------------------

  function wireApp() {
    // Tabs -- the strip on a wide screen...
    $('tab-strip').addEventListener('click', function (e) {
      var tab = e.target.closest('.tab');
      if (tab) selectTab(tab.id);
    });

    // ...and the dropdown on a narrow one.
    var tabBtn = $('tab-menu-btn');
    var tabList_ = $('tab-menu-list');

    tabBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = tabList_.hidden;
      tabList_.hidden = !open;
      tabBtn.setAttribute('aria-expanded', String(open));
    });

    tabList_.addEventListener('click', function (e) {
      var b = e.target.closest('[data-goto]');
      if (!b) return;
      tabList_.hidden = true;
      tabBtn.setAttribute('aria-expanded', 'false');
      selectTab(b.dataset.goto);
    });

    document.addEventListener('click', function () {
      if (!tabList_.hidden) {
        tabList_.hidden = true;
        tabBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // Search
    var searchTimer = null;
    $('search-box').addEventListener('input', function (e) {
      clearTimeout(searchTimer);
      var v = e.target.value;
      searchTimer = setTimeout(function () {
        state.query = v.trim();
        renderContent();
      }, 120);
    });

    $('search-clear').addEventListener('click', function () {
      $('search-box').value = '';
      state.query = '';
      renderContent();
      $('search-box').focus();
    });

    // Chore actions
    $('content-field').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var card = b.closest('[data-chore]');
      if (!card) return;
      doAction(b.dataset.act, card.dataset.chore, b);
    });

    // Add
    $('new-chore').addEventListener('click', function () { choreForm(null); });

    // Account menu
    var chip = $('account-chip');
    var menu = $('account-menu');

    chip.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = menu.hidden;
      menu.hidden = !open;
      chip.setAttribute('aria-expanded', String(open));
    });

    document.addEventListener('click', function () {
      if (!menu.hidden) {
        menu.hidden = true;
        chip.setAttribute('aria-expanded', 'false');
      }
    });

    menu.addEventListener('click', function (e) {
      var item = e.target.closest('[data-menu]');
      if (!item) return;
      menu.hidden = true;
      chip.setAttribute('aria-expanded', 'false');
      menuAction(item.dataset.menu);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !menu.hidden) menu.hidden = true;
    });
  }

  function doAction(act, choreId, button) {
    var c = state.chores.filter(function (x) { return x.choreId === choreId; })[0];

    if (act === 'edit') { choreForm(c); return; }
    if (act === 'assign') { assignForm(c); return; }
    if (act === 'sendback') { sendBackForm(c); return; }
    if (act === 'delete') {
      confirmModal('Delete this chore?', c ? c.title : '', 'Delete', function () {
        run('deleteChore', { choreId: choreId }, 'Deleted.');
      }, true);
      return;
    }

    var map = {
      claim:   ['claimChore',   'Claimed. It is yours.'],
      release: ['releaseChore', 'Back in the pool.'],
      start:   ['startChore',   'Started.'],
      pause:   ['pauseChore',   'Paused.'],
      submit:  ['submitChore',  'Sent for approval.'],
      approve: ['approveChore', 'Approved.'],
      reopen:  ['reopenChore',  'Back in the pool.']
    }[act];
    if (!map) return;

    // The card as a whole goes quiet, not just the button that was pressed --
    // otherwise Claim spins while Edit next to it is still live.
    var card = button.closest('[data-chore]');
    busy(button, true);
    busyCard(card, true);

    api(map[0], { choreId: choreId })
      .then(function (data) { applyBoard(data); toast(map[1], 'good'); })
      .catch(function (err) {
        fail(err);
        // A rejected transition usually means somebody else moved first, so
        // the card in front of them is stale. Repaint from the server.
        refresh().catch(function () {});
      })
      .then(function () { busy(button, false); busyCard(card, false); });
  }

  /** Runs an action, repaints from its reply, and says so. */
  function run(action, payload, okMsg) {
    return api(action, payload)
      .then(function (data) {
        applyBoard(data);
        closeModal();
        if (okMsg) toast(okMsg, 'good');
      })
      .catch(fail);
  }

  /**
   * Asks for the household password, then runs the thing behind it.
   *
   * Both doors out of "who is using this device" go through here. Once
   * somebody has picked their name they stay picked -- the member session
   * now lasts as long as the device is trusted -- so the only ways the
   * active person changes are switching and signing out, and a child must
   * not be able to do either on their own.
   *
   * `go(password, onError)` does the work; onError puts the message under
   * the field and clears it, rather than closing the dialog, so a mistyped
   * password does not mean starting again.
   */
  function askHouseholdPassword(title, blurb, okLabel, go) {
    openModal(esc(title),
      (blurb ? '<p class="form-hint" style="text-align:left">' + esc(blurb) +
               '</p>' : '') +
      '<form class="form" id="hpw-form" autocomplete="on">' +
        '<label class="field"><span>Household password</span>' +
          '<input type="password" name="password" ' +
                 'autocomplete="current-password" /></label>' +
        '<p class="form-error" id="hpw-error" role="alert" hidden></p>' +
      '</form>',
      [
        { label: 'Cancel', kind: 'btn-secondary', act: closeModal },
        { label: okLabel, kind: 'btn-primary', act: submit }
      ]);

    var f = $('hpw-form');

    function submit(btn) {
      var pw = f.password.value;
      if (!pw) { showErr(new Error('Enter the household password.')); return; }
      busy(btn, true);
      go(pw, function (err) {
        busy(btn, false);
        showErr(err);
      });
    }

    function showErr(err) {
      var box = $('hpw-error');
      box.textContent = err.message;
      box.hidden = false;
      f.password.value = '';
      f.password.focus();
    }

    // Enter is what people press in a password field; there is no submit
    // button inside the form, so it has to be caught here.
    f.addEventListener('submit', function (e) { e.preventDefault(); });
    f.password.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      submit(document.querySelector('[data-modal-btn="1"]'));
    });

    f.password.focus();
  }

  function menuAction(which) {
    if (which === 'switch') {
      askHouseholdPassword(
        'Switch person',
        'Only the account holder can change who is using this device.',
        'Switch',
        function (password, onError) {
          api('releaseMember', { password: password }).then(function () {
            TOKENS.member = '';
            state.me = null;
            closeModal();
            renderPicker();
            show('picker');
          }).catch(onError);
        });

    } else if (which === 'signout') {
      askHouseholdPassword(
        'Sign this device out?',
        'This forgets the device entirely. You will need the household ' +
        'email and password to get back in.',
        'Sign out',
        function (password, onError) {
          api('signOutDevice', { password: password }).then(function () {
            TOKENS.household = '';
            TOKENS.member = '';
            closeModal();
            show('gate');
          }).catch(onError);
        });

    } else if (which === 'accounts') {
      accountsForm();
    } else if (which === 'password') {
      passwordForm();
    } else if (which === 'trough') {
      troughForm();
    } else if (which === 'sty') {
      styForm();
    } else if (which === 'store') {
      storeForm();
    }
  }

  // -----------------------------------------------------------------
  // The Trough -- the daily hand-out
  // -----------------------------------------------------------------

  function troughForm() {
    api('loadTrough', {}).then(renderTrough).catch(fail);
  }

  function renderTrough(t) {
    var rows = t.items.length
      ? t.items.map(function (i) {
          return '<div class="list-row">' +
            '<span class="grow">' +
              '<span class="t">' + esc(i.title) + '</span>' +
              (i.category || i.notes
                ? '<span class="sub">' +
                  esc([i.category, i.notes].filter(Boolean).join(' · ')) +
                  '</span>'
                : '') +
              whenWhoTags(audienceSummary(i, t), scheduleSummary(i)) +
            '</span>' +
            '<span class="cost">' + i.points + 'p</span>' +
            (t.canEdit
              ? '<span class="row-acts">' +
                  '<button class="btn btn-sm btn-secondary" data-tedit="' +
                    esc(i.troughId) + '">Edit</button>' +
                  '<button class="btn btn-sm btn-quiet" data-tdel="' +
                    esc(i.troughId) + '">Remove</button>' +
                '</span>'
              : '') +
          '</div>';
        }).join('')
      : '<p class="form-hint">Nothing on the list yet.</p>';

    var last = t.lastFilled
      ? '<p class="form-hint" style="text-align:left">Filled today — ' +
          t.lastFilled.total + ' chores handed out.</p>' +
        '<div class="fill-summary">' +
          t.lastFilled.perPerson.map(function (p) {
            return '<span class="fill-chip">' +
              '<span class="dot" style="background:' + esc(p.color) + '"></span>' +
              esc(p.name) + ' &middot; ' + p.count + ' &middot; ' + p.points + 'p</span>';
          }).join('') +
        '</div>'
      : '<p class="form-hint" style="text-align:left">Not filled today yet.</p>';

    openModal(esc(t.name),
      '<p class="form-hint" style="text-align:left">' +
        'Chores that come round on a schedule and are <strong>shared ' +
        'out</strong> — one chore, one person. The pick happens inside ' +
        'whoever the chore is aimed at, nobody gets the same one twice ' +
        'running, and the points come out roughly even.' +
      '</p>' +
      '<p class="form-hint" style="text-align:left">' +
        'Handed out automatically every night at ' + fillHourLabel(t.fillHour) +
        '. Nothing to press. Anything on this list stays until you take it off.' +
      '</p>' +
      last +
      '<hr class="hr">' +
      '<div class="list-rows" id="trough-rows">' + rows + '</div>' +
      (t.canEdit
        ? '<hr class="hr">' +
          '<div class="section-head"><h3>Add to the list</h3></div>' +
          '<form class="form" id="trough-add">' +
            '<div class="field"><label for="trough-title">Chore</label>' +
              comboHtml({ id: 'trough-title', name: 'title',
                          options: choreOptions() }) +
            '</div>' +
            '<label class="field"><span>Points</span>' +
              '<input type="number" id="trough-points" name="points" ' +
                     'min="0" max="999" placeholder="0" />' +
            '</label>' +
            '<div class="field"><label for="trough-cat">Category</label>' +
              comboHtml({ id: 'trough-cat', name: 'category', maxlength: 40,
                          placeholder: 'Pick one, or type your own',
                          options: plainOptions(state.categories) }) +
            '</div>' +
            audienceFieldHtml('trough-new', null, t, 'Shared out between') +
            scheduleFieldHtml('trough-new', null, t) +
          '</form>'
        : ''),
      [{ label: 'Close', kind: 'btn-secondary', act: closeModal }]
        .concat(t.canEdit ? [
          { label: 'Add', kind: 'btn-primary', act: function (btn) {
              var f = $('trough-add');
              if (!f.title.value.trim()) { toast('Enter a chore.', 'bad'); return; }
              var problem = audienceProblem('trough-new');
              if (problem) { toast(problem, 'bad'); return; }

              busy(btn, true);
              var who = readAudience('trough-new');
              var when = readSchedule('trough-new');

              api('addTroughItem', {
                title: f.title.value,
                points: f.points.value,
                category: f.category.value,
                audience: who.audience,
                groupId: who.groupId,
                memberIds: who.memberIds,
                frequency: when.frequency,
                onDay: when.onDay
              }).then(function (data) {
                renderTrough(data);
                toast('Added to the list.', 'good');
              }).catch(fail).then(function () { busy(btn, false); });
            } }
        ] : [])
      );

    // Picking a ready-made chore fills the points and category in.
    var addForm = $('trough-add');
    if (addForm) {
      wireCombo('trough-title');
      wireCombo('trough-cat');
      wireAudienceField('trough-new');
      wireScheduleField('trough-new');

      addForm.title.addEventListener('input', function () {
        var typed = addForm.title.value.trim().toLowerCase();
        if (!typed) return;
        for (var i = 0; i < state.suggestions.length; i++) {
          var x = state.suggestions[i];
          if (String(x.title).toLowerCase() === typed) {
            addForm.points.value = x.points;
            addForm.category.value = x.category || '';
            return;
          }
        }
      });
    }

    var host = $('trough-rows');
    if (host) {
      host.addEventListener('click', function (e) {
        var del = e.target.closest('[data-tdel]');
        var ed = e.target.closest('[data-tedit]');

        if (del) {
          busy(del, true);
          api('removeTroughItem', { troughId: del.dataset.tdel })
            .then(renderTrough).catch(fail);
          return;
        }
        if (ed) {
          var item = t.items.filter(function (i) {
            return i.troughId === ed.dataset.tedit;
          })[0];
          if (item) troughItemForm(item, t);
        }
      });
    }
  }

  /** "midnight", "1am", "11pm" -- for the line explaining the schedule. */
  function fillHourLabel(h) {
    h = Number(h) || 0;
    if (h === 0) return 'midnight';
    if (h === 12) return 'midday';
    return h < 12 ? h + 'am' : (h - 12) + 'pm';
  }

  function troughItemForm(item, t) {
    openModal('Edit ' + esc(item.title),
      '<form class="form" id="titem-form">' +
        '<label class="field"><span>Chore</span>' +
          '<input name="title" value="' + esc(item.title) + '" maxlength="120" /></label>' +
        '<label class="field"><span>Points</span>' +
          '<input type="number" name="points" min="0" max="999" value="' +
            (item.points || 0) + '" /></label>' +
        '<label class="field"><span>Category</span>' +
          '<input name="category" value="' + esc(item.category || '') +
          '" maxlength="40" /></label>' +
        '<label class="field"><span>Details</span>' +
          '<textarea name="notes" maxlength="1000">' + esc(item.notes || '') +
          '</textarea></label>' +
        audienceFieldHtml('trough-ed', item, t, 'Shared out between') +
        scheduleFieldHtml('trough-ed', item, t) +
      '</form>',
      [
        { label: 'Back', kind: 'btn-secondary', act: troughForm },
        { label: 'Save', kind: 'btn-primary', act: function (btn) {
            var f = $('titem-form');
            var problem = audienceProblem('trough-ed');
            if (problem) { toast(problem, 'bad'); return; }

            busy(btn, true);
            var who = readAudience('trough-ed');

            api('updateTroughItem', {
              troughId: item.troughId,

            }).then(function (data) {

              toast('Saved.', 'good');
            }).catch(fail).then(function () { busy(btn, false); });
          } }
      ]);

    wireAudienceField('trough-ed');
    wireScheduleField('trough-ed');
  }

  // -----------------------------------------------------------------
  // The ready-made-list combobox
  // -----------------------------------------------------------------
  //
  // Stands in for <input list="..."> + <datalist>. A datalist gets no dropdown
  // at all on mobile Safari, and the Android browsers that do render one are
  // inconsistent about it -- so on a phone the ready-made chores could not be
  // browsed, only guessed at. This is the same combobox built out of ordinary
  // DOM: still a text box you can type anything into, plus a list you can
  // actually tap.
  //
  // Selecting fires an 'input' event on the box, so the existing "fill the
  // rest of the form in" handlers keep working untouched -- they cannot tell a
  // tap from typing, which is what they already assumed.
  //
  // cfg: { id, name, options: [{ value, meta }], value, placeholder,
  //        required, maxlength }
  function comboHtml(cfg) {
    var opts = (cfg.options || []).map(function (o, i) {
      return '<button type="button" class="combo-opt" role="option" ' +
                     'data-i="' + i + '" data-value="' + esc(o.value) + '">' +
               '<span class="combo-label">' + esc(o.value) + '</span>' +
               (o.meta
                 ? '<span class="combo-meta">' + esc(o.meta) + '</span>'
                 : '') +
             '</button>';
    }).join('');

    var attrs =
      'id="' + cfg.id + '" name="' + esc(cfg.name) + '" ' +
      'value="' + esc(cfg.value || '') + '" ' +
      'placeholder="' + esc(cfg.placeholder || 'Pick one, or type your own') + '" ' +
      'maxlength="' + (cfg.maxlength || 120) + '" ' +
      'autocomplete="off" role="combobox" aria-expanded="false" ' +
      'aria-autocomplete="list" aria-controls="' + cfg.id + '-panel"' +
      (cfg.required ? ' required' : '');

    return '<div class="combo" id="' + cfg.id + '-combo">' +
             '<div class="combo-bar">' +
               '<input ' + attrs + ' />' +
               (opts
                 ? '<button type="button" class="combo-toggle" ' +
                           'id="' + cfg.id + '-toggle" ' +
                           'aria-label="Show the list" tabindex="-1">' +
                     '<span class="combo-chev">▾</span>' +
                   '</button>'
                 : '') +
             '</div>' +
             (opts
               ? '<div class="combo-panel" id="' + cfg.id + '-panel" ' +
                        'role="listbox" hidden>' + opts +
                   '<p class="combo-empty" id="' + cfg.id + '-none" hidden>' +
                     'Nothing matches -- what you have typed is used as it is.' +
                   '</p>' +
                 '</div>'
               : '') +
           '</div>';
  }

  /**
   * Brings a comboHtml block to life. Call once, after the markup is in the
   * document. Safe to call for an id that was rendered without options.
   */
  function wireCombo(id) {
    var box = $(id);
    var panel = $(id + '-panel');
    if (!box || !panel) return;

    var wrap = $(id + '-combo');
    var toggle = $(id + '-toggle');
    var none = $(id + '-none');
    var opts = [].slice.call(panel.querySelectorAll('.combo-opt'));
    var here = -1;
    var picking = false;

    function shown() {
      return opts.filter(function (o) { return !o.hidden; });
    }

    function mark(el) {
      opts.forEach(function (o) { o.classList.remove('here'); });
      if (el) {
        el.classList.add('here');
        // Only the panel scrolls -- never the page, which on a phone would
        // yank the form out from under the thumb.
        if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      }
    }

    function open() {
      if (!panel.hidden) return;
      panel.hidden = false;
      wrap.classList.add('open');
      box.setAttribute('aria-expanded', 'true');
    }

    function shut() {
      if (panel.hidden) return;
      panel.hidden = true;
      wrap.classList.remove('open');
      box.setAttribute('aria-expanded', 'false');
      here = -1;
      mark(null);
    }

    /** Substring, case-insensitive. An empty box shows everything. */
    function filter() {
      var q = box.value.trim().toLowerCase();
      var n = 0;

      // A box holding one of the rows exactly is a finished choice, not a
      // search in progress. Narrowing to the single row somebody just picked
      // would leave them no way to change their mind, so show the lot.
      if (q && opts.some(function (o) {
            return o.dataset.value.toLowerCase() === q;
          })) {
        q = '';
      }
      opts.forEach(function (o) {
        var hit = !q || o.dataset.value.toLowerCase().indexOf(q) >= 0;
        o.hidden = !hit;
        if (hit) n++;
      });
      if (none) none.hidden = n > 0;
      here = -1;
      mark(null);
    }

    function choose(el) {
      box.value = el.dataset.value;

      // What tells the form to fill itself in. Bubbles, like a real edit --
      // which is the point, and also why the flag is needed: our own 'input'
      // listener would otherwise read it as typing and re-open the list.
      picking = true;
      box.dispatchEvent(new Event('input', { bubbles: true }));
      picking = false;

      shut();
      box.focus();
    }

    box.addEventListener('input', function () {
      if (picking) return;
      filter();
      open();
    });

    // A tap opens it, focus alone does not: openModal focuses the first
    // control in the dialog, and a list that unfurls on arrival buries the
    // rest of the form. ArrowDown is the keyboard's way in.
    box.addEventListener('click', function () { filter(); open(); });

    // mousedown, not click: a click lands after the box has already blurred.
    panel.addEventListener('mousedown', function (e) { e.preventDefault(); });
    panel.addEventListener('click', function (e) {
      var el = e.target.closest('.combo-opt');
      if (el) choose(el);
    });

    if (toggle) {
      toggle.addEventListener('click', function () {
        if (panel.hidden) { filter(); open(); box.focus(); } else { shut(); }
      });
    }

    box.addEventListener('keydown', function (e) {
      var list = shown();

      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (panel.hidden) { filter(); open(); list = shown(); }
        if (!list.length) return;
        var at = list.indexOf(opts[here]);
        at = e.key === 'ArrowDown'
          ? (at + 1) % list.length
          : (at <= 0 ? list.length - 1 : at - 1);
        here = opts.indexOf(list[at]);
        mark(list[at]);
        return;
      }

      // Enter takes the highlighted row, and otherwise falls through so the
      // form behaves as it always did -- typing your own and pressing return
      // must not be hijacked.
      if (e.key === 'Enter' && !panel.hidden && here >= 0) {
        e.preventDefault();
        choose(opts[here]);
        return;
      }

      if (e.key === 'Escape' && !panel.hidden) {
        e.stopPropagation();   // ...or the whole modal goes with it.
        shut();
      }
    });

    // A tap anywhere else puts it away. Hung on openModal's cleanup chain so
    // it comes off with the dialog -- otherwise every dialog opened leaves its
    // comboboxes' listeners behind on a document that outlives them.
    var away = function (e) { if (!wrap.contains(e.target)) shut(); };
    document.addEventListener('mousedown', away);

    var prevCleanup = modalCleanup;
    modalCleanup = function () {
      document.removeEventListener('mousedown', away);
      if (prevCleanup) prevCleanup();
    };

    box.addEventListener('blur', function () {
      // After the panel's own mousedown, which is already prevented.
      setTimeout(function () {
        if (!wrap.contains(document.activeElement)) shut();
      }, 0);
    });
  }

  /** The ready-made chores, shaped for comboHtml. */
  function choreOptions() {
    return state.suggestions.map(function (x) {
      var bits = [];
      if (x.category) bits.push(x.category);
      if (Number(x.points)) bits.push(x.points + 'p');
      if (x.recurrence) bits.push(x.recurrence);
      return { value: x.title, meta: bits.join(' · ') };
    });
  }

  /** A plain list of strings, shaped for comboHtml. */
  function plainOptions(list) {
    return (list || []).map(function (v) { return { value: v }; });
  }

  // -----------------------------------------------------------------
  // Who gets it, and when
  // -----------------------------------------------------------------
  //
  // Both daily lists ask the same question about people and a different one
  // about timing, so the people half is shared and the timing halves sit
  // beside it:
  //
  //   audience     everyone / a named group / specific people   (both lists)
  //   days         which weekdays it goes out                   (the Sty)
  //   frequency    how often it comes round                     (the Trough)
  //
  // Every builder takes a `pre` prefix for its element ids, so an add form
  // and an edit form can be on screen at once without colliding.

  var WEEKDAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var WEEKDAY_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday',
                      'Thursday', 'Friday', 'Saturday'];

  function weekdayNames(list) {
    return (list && list.length === 7) ? list : WEEKDAY_NAMES;
  }

  // --- The people half ----------------------------------------------

  function audienceFieldHtml(pre, item, data, label) {
    var a = (item && item.audience) || 'everyone';
    var gid = (item && item.groupId) || '';
    var picked = {};
    ((item && item.memberIds) || []).forEach(function (id) {
      picked[String(id)] = true;
    });

    var opts = '<option value="everyone"' +
               (a === 'everyone' ? ' selected' : '') + '>Everyone</option>';

    (data.groups || []).forEach(function (g) {
      opts += '<option value="group:' + esc(g.groupId) + '"' +
        (a === 'group' && String(gid) === String(g.groupId) ? ' selected' : '') +
        '>' + esc(g.name) + '</option>';
    });

    opts += '<option value="people"' + (a === 'people' ? ' selected' : '') +
            '>Pick people…</option>';

    return '' +
      '<label class="field"><span>' + esc(label || 'Who gets it') + '</span>' +
        '<select id="' + pre + '-aud">' + opts + '</select>' +
        ((data.groups || []).length
          ? '<small>Groups are set up under Manage accounts.</small>'
          : '<small>Make a group under Manage accounts to reuse a set of ' +
            'people across chores.</small>') +
      '</label>' +
      '<div class="field" id="' + pre + '-people"' +
        (a === 'people' ? '' : ' hidden') + '>' +
        '<span>Which people</span>' +
        '<div class="chips">' +
          (data.members || []).map(function (m) {
            return '<button type="button" class="chip-pick' +
              (picked[String(m.memberId)] ? ' on' : '') +
              '" data-who="' + esc(m.memberId) + '">' + esc(m.name) +
              '</button>';
          }).join('') +
        '</div>' +
      '</div>';
  }

  function wireAudienceField(pre) {
    var sel = $(pre + '-aud');
    var box = $(pre + '-people');
    if (!sel || !box) return;

    sel.addEventListener('change', function () {
      box.hidden = sel.value !== 'people';
    });

    box.addEventListener('click', function (e) {
      var chip = e.target.closest('[data-who]');
      if (!chip) return;
      chip.classList.toggle('on');
    });
  }

  /** The three audience fields, in the shape the server stores. */
  function readAudience(pre) {
    var v = $(pre + '-aud').value;

    if (v === 'people') {
      var ids = [];
      var chips = $(pre + '-people').querySelectorAll('.chip-pick.on');
      for (var i = 0; i < chips.length; i++) ids.push(chips[i].dataset.who);
      return { audience: 'people', memberIds: ids.join(','), groupId: '' };
    }

    if (v.indexOf('group:') === 0) {
      return { audience: 'group', groupId: v.slice(6), memberIds: '' };
    }
    return { audience: 'everyone', groupId: '', memberIds: '' };
  }

  /**
   * Says what is wrong with the audience, or null.
   *
   * Checked before the call so the server's error never has to be the first
   * thing anybody sees.
   */
  function audienceProblem(pre) {
    var v = $(pre + '-aud').value;
    if (v === 'people' && !readAudience(pre).memberIds) {
      return 'Pick at least one person.';
    }
    return null;
  }

  /** "Everyone", "The Kids", "Alex and Addie" -- for a list row. */
  function audienceSummary(item, data) {
    var kind = (item && item.audience) || 'everyone';
    if (kind === 'everyone') return 'Everyone';

    if (kind === 'group') {
      var g = (data.groups || []).filter(function (x) {
        return String(x.groupId) === String(item.groupId);
      })[0];
      // A group deleted out from under an item. Said plainly, because the
      // item is now going to nobody at all.
      return g ? g.name : 'Group deleted — nobody';
    }

    var names = (item.memberIds || []).map(function (id) {
      var m = (data.members || []).filter(function (x) {
        return String(x.memberId) === String(id);
      })[0];
      return m ? m.name : null;
    }).filter(Boolean);

    if (!names.length) return 'Nobody';
    if (names.length === 1) return names[0];
    return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  }

  // --- The Sty's half: which days -----------------------------------

  function daysFieldHtml(pre, item, names) {
    names = weekdayNames(names);
    var days = (item && item.days) || [];
    var on = {};
    // Blank means every day, so a new item starts with all seven lit rather
    // than none -- "every day" is what most chores actually are.
    if (!days.length) { for (var i = 0; i < 7; i++) on[i] = true; }
    else days.forEach(function (d) { on[Number(d)] = true; });

    var chips = '';
    for (var d = 0; d < 7; d++) {
      chips += '<button type="button" class="chip-pick' +
               (on[d] ? ' on' : '') + '" data-day="' + d + '">' +
               esc(names[d]) + '</button>';
    }

    return '<div class="field" id="' + pre + '-days-box">' +
      '<span>Which days</span>' +
      '<div class="chips">' + chips + '</div>' +
      '<small>All seven is every day. An unfinished chore still carries ' +
      'over into the days it is off.</small>' +
    '</div>';
  }

  function wireDaysField(pre) {
    var box = $(pre + '-days-box');
    if (!box) return;
    box.addEventListener('click', function (e) {
      var chip = e.target.closest('[data-day]');
      if (!chip) return;
      chip.classList.toggle('on');
    });
  }

  function readDays(pre) {
    var out = [];
    var chips = $(pre + '-days-box').querySelectorAll('.chip-pick.on');
    for (var i = 0; i < chips.length; i++) out.push(chips[i].dataset.day);
    return out.join(',');
  }

  function daysProblem(pre) {
    return readDays(pre) ? null : 'Pick at least one day.';
  }

  /** "Every day" or "Mon, Tue, Wed, Thu". */
  function daysSummary(item, names) {
    names = weekdayNames(names);
    var days = (item && item.days) || [];
    if (!days.length || days.length === 7) return 'Every day';
    return days.slice().sort(function (a, b) { return a - b; })
      .map(function (d) { return names[Number(d)]; }).join(', ');
  }

  // --- The Trough's half: how often ---------------------------------

  var FREQ_LABELS = {
    daily: 'Every day',
    weekly: 'Every week',
    fortnightly: 'Every other week',
    monthly: 'Every month'
  };

  function scheduleFieldHtml(pre, item, data) {
    var freq = (item && item.frequency) || 'daily';
    var onDay = Number((item && item.onDay) || 0);
    var list = data.frequencies || ['daily', 'weekly', 'fortnightly', 'monthly'];

    var opts = list.map(function (f) {
      return '<option value="' + esc(f) + '"' +
             (f === freq ? ' selected' : '') + '>' +
             esc(FREQ_LABELS[f] || f) + '</option>';
    }).join('');

    var wdOpts = '';
    for (var d = 0; d < 7; d++) {
      wdOpts += '<option value="' + d + '"' +
        (d === onDay && freq !== 'monthly' ? ' selected' : '') + '>' +
        esc(WEEKDAY_LONG[d]) + '</option>';
    }

    var monthDay = freq === 'monthly' ? Math.max(1, Math.min(28, onDay)) : 1;

    return '' +
      '<label class="field"><span>How often</span>' +
        '<select id="' + pre + '-freq">' + opts + '</select>' +
      '</label>' +
      '<label class="field" id="' + pre + '-wd-box"' +
        (freq === 'weekly' || freq === 'fortnightly' ? '' : ' hidden') + '>' +
        '<span>On which day</span>' +
        '<select id="' + pre + '-wd">' + wdOpts + '</select>' +
      '</label>' +
      '<label class="field" id="' + pre + '-md-box"' +
        (freq === 'monthly' ? '' : ' hidden') + '>' +
        '<span>On which date</span>' +
        '<input type="number" id="' + pre + '-md" min="1" max="28" value="' +
          monthDay + '" />' +
        '<small>1 to 28. A later date would skip the short months.</small>' +
      '</label>';
  }

  function wireScheduleField(pre) {
    var sel = $(pre + '-freq');
    if (!sel) return;
    sel.addEventListener('change', function () {
      var f = sel.value;
      $(pre + '-wd-box').hidden = !(f === 'weekly' || f === 'fortnightly');
      $(pre + '-md-box').hidden = f !== 'monthly';
    });
  }

  function readSchedule(pre) {
    var f = $(pre + '-freq').value;
    if (f === 'weekly' || f === 'fortnightly') {
      return { frequency: f, onDay: $(pre + '-wd').value };
    }
    if (f === 'monthly') {
      return { frequency: f, onDay: $(pre + '-md').value };
    }
    return { frequency: 'daily', onDay: 0 };
  }

  /** "Every day", "Every Saturday", "Every other Saturday", "The 1st...". */
  function scheduleSummary(item) {
    var f = (item && item.frequency) || 'daily';
    var d = Number((item && item.onDay) || 0);

    if (f === 'weekly') return 'Every ' + WEEKDAY_LONG[d % 7];
    if (f === 'fortnightly') return 'Every other ' + WEEKDAY_LONG[d % 7];
    if (f === 'monthly') {
      return 'The ' + ordinal(Math.max(1, Math.min(28, d))) + ' of the month';
    }
    return 'Every day';
  }

  function ordinal(n) {
    var s = ['th', 'st', 'nd', 'rd'];
    var v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  /** The two little tags under a Trough or Sty row: who, and when. */
  function whenWhoTags(who, when) {
    return '<span class="row-tags">' +
      '<span class="row-tag">' + esc(who) + '</span>' +
      '<span class="row-tag">' + esc(when) + '</span>' +
    '</span>';
  }

  // -----------------------------------------------------------------
  // Modals
  // -----------------------------------------------------------------

  var modalCleanup = null;

  function openModal(title, bodyHtml, buttons) {
    closeModal();

    var acts = (buttons || []).map(function (b, i) {
      return '<button class="btn ' + (b.kind || 'btn-secondary') +
             '" data-modal-btn="' + i + '">' + esc(b.label) + '</button>';
    }).join('');

    var root = $('modal-root');
    root.innerHTML =
      '<div class="backdrop" id="backdrop">' +
        '<div class="modal" role="dialog" aria-modal="true">' +
          '<div class="modal-head">' +
            '<h2>' + title + '</h2>' +
            '<button class="modal-close" aria-label="Close">×</button>' +
          '</div>' +
          '<div class="modal-body">' + bodyHtml + '</div>' +
          (acts ? '<div class="modal-actions">' + acts + '</div>' : '') +
        '</div>' +
      '</div>';

    root.querySelector('.modal-close').addEventListener('click', closeModal);

    root.querySelector('.backdrop').addEventListener('mousedown', function (e) {
      if (e.target.id === 'backdrop') closeModal();
    });

    (buttons || []).forEach(function (b, i) {
      var el = root.querySelector('[data-modal-btn="' + i + '"]');
      if (el) el.addEventListener('click', function () { b.act(el); });
    });

    var onEsc = function (e) { if (e.key === 'Escape') closeModal(); };
    document.addEventListener('keydown', onEsc);
    var prevCleanup = modalCleanup;
    modalCleanup = function () {
      document.removeEventListener('keydown', onEsc);
      if (prevCleanup) prevCleanup();
    };

    // Focus the first real control so a keyboard user starts inside.
    var first = root.querySelector('input, select, textarea, button');
    if (first) first.focus();
  }

  function closeModal() {
    if (modalCleanup) { modalCleanup(); modalCleanup = null; }
    $('modal-root').innerHTML = '';
  }

  function confirmModal(title, body, okLabel, onOk, danger) {
    openModal(esc(title),
      body ? '<p>' + esc(body) + '</p>' : '',
      [
        { label: 'Cancel', kind: 'btn-secondary', act: closeModal },
        { label: okLabel, kind: danger ? 'btn-danger' : 'btn-primary',
          act: onOk }
      ]);
  }

  // --- New / edit a chore -------------------------------------------

  function choreForm(existing) {
    var editing = !!existing;
    var c = existing || {};

    var chosen = Number(c.points) || 0;
    var isPreset = state.pointPresets.indexOf(chosen) >= 0 || chosen === 0;

    var pts = state.pointPresets.map(function (p) {
      return '<button type="button" class="chip-pick' +
             (chosen === p ? ' on' : '') +
             '" data-points="' + p + '">' + p + 'p</button>';
    }).join('');

    var people = state.members.map(function (m) {
      return '<option value="' + esc(m.memberId) + '"' +
             (c.assigneeId === m.memberId ? ' selected' : '') + '>' +
             esc(m.name) + '</option>';
    }).join('');

    openModal(editing ? 'Edit chore' : 'New chore',
      '<form class="form" id="chore-form">' +
        // Ready-made chores. Picking one fills the rest of the form in;
        // typing something not on the list leaves it to be filled by hand.
        '<div class="field"><label for="chore-title">What needs doing?</label>' +
          comboHtml({ id: 'chore-title', name: 'title', required: true,
                      value: c.title, options: choreOptions() }) +
          '<small id="sugg-hint">' +
            (state.suggestions.length
              ? 'Pick a ready-made chore to fill the rest in, or type your own.'
              : '') +
          '</small></div>' +

        '<label class="field"><span>Details <small>(optional)</small></span>' +
          '<textarea name="notes" maxlength="1000">' + esc(c.notes || '') +
          '</textarea></label>' +

        '<div class="field"><label for="chore-cat">Category</label>' +
          comboHtml({ id: 'chore-cat', name: 'category', maxlength: 40,
                      value: c.category, placeholder: 'Pick one, or type your own',
                      options: plainOptions(state.categories) }) +
        '</div>' +

        '<div class="field"><span>Points</span>' +
          '<div class="chips" id="point-chips">' + pts +
            '<button type="button" class="chip-pick' +
              (chosen === 0 ? ' on' : '') + '" data-points="0">None</button>' +
            '<button type="button" class="chip-pick' +
              (isPreset ? '' : ' on') + '" data-points="custom">Custom…</button>' +
          '</div>' +
          '<input type="number" id="point-custom" name="pointsCustom" ' +
                 'min="0" max="999" step="1" placeholder="Points" ' +
                 'value="' + (isPreset ? '' : chosen) + '"' +
                 (isPreset ? ' hidden' : '') + ' />' +
          '<input type="hidden" name="points" value="' + chosen + '" />' +
        '</div>' +

        '<label class="field"><span>Due <small>(optional)</small></span>' +
          '<input type="date" name="dueDate" value="' + esc(c.dueDate || '') +
          '" /></label>' +

        '<label class="field"><span>Repeats</span>' +
          '<select name="recurrence">' +
            ['', 'daily', 'weekly', 'monthly'].map(function (r) {
              return '<option value="' + r + '"' +
                     ((c.recurrence || '') === r ? ' selected' : '') + '>' +
                     (r ? r.charAt(0).toUpperCase() + r.slice(1) : 'Does not repeat') +
                     '</option>';
            }).join('') +
          '</select>' +
          '<small>Repeats are posted overnight with the daily lists, and ' +
          'only once the last one has been finished.</small>' +
        '</label>' +

        (!editing
          ? '<label class="field"><span>Give it to</span>' +
              '<select name="assigneeId"><option value="">' +
              'Anyone — put it in the pool</option>' + people +
              '</select></label>'
          : '') +
      '</form>',
      [
        { label: 'Cancel', kind: 'btn-secondary', act: closeModal },
        { label: editing ? 'Save' : 'Post it', kind: 'btn-primary',
          act: function (btn) {
            var f = $('chore-form');
            if (!f.reportValidity()) return;

            var payload = {
              title: f.title.value,
              notes: f.notes.value,
              category: f.category.value,
              dueDate: f.dueDate.value,
              recurrence: f.recurrence.value
            };
            payload.points = Number(f.points.value) || 0;
            if (f.assigneeId) payload.assigneeId = f.assigneeId.value;

            busy(btn, true);
            if (editing) {
              payload.choreId = c.choreId;
              run('updateChore', payload, 'Saved.')
                .then(function () { busy(btn, false); });
            } else {
              run('createChore', payload, 'Posted.')
                .then(function () { busy(btn, false); });
            }
          } }
      ]);

    var form = $('chore-form');
    var chips = $('point-chips');
    var custom = $('point-custom');

    wireCombo('chore-title');
    wireCombo('chore-cat');

    chips.addEventListener('click', function (e) {
      var b = e.target.closest('[data-points]');
      if (!b) return;

      chips.querySelectorAll('.chip-pick').forEach(function (x) {
        x.classList.remove('on');
      });
      b.classList.add('on');

      if (b.dataset.points === 'custom') {
        custom.hidden = false;
        custom.focus();
        form.points.value = Number(custom.value) || 0;
      } else {
        custom.hidden = true;
        form.points.value = b.dataset.points;
      }
    });

    custom.addEventListener('input', function () {
      var v = Math.max(0, Math.min(999, Math.round(Number(custom.value) || 0)));
      form.points.value = v;
    });

    // Picking a ready-made chore fills the rest of the form in. Everything it
    // sets stays editable -- it is a starting point, not a template.
    //
    // Fires on 'input' rather than 'change' because a pick from the list and
    // a typed word arrive as the same event -- deliberately, so that the two
    // paths cannot drift apart. Matching the exact title is what tells them
    // apart; typing a name that is not on the list changes nothing else.
    form.title.addEventListener('input', function () {
      var typed = form.title.value.trim().toLowerCase();
      var hint = $('sugg-hint');
      var hit = null;

      // An empty box matches nothing. Worth being explicit about: while every
      // title was blank, clearing the field matched the first suggestion and
      // the form filled itself in unbidden.
      if (!typed) {
        if (hint && state.suggestions.length) {
          hint.textContent =
            'Pick a ready-made chore to fill the rest in, or type your own.';
        }
        return;
      }

      for (var i = 0; i < state.suggestions.length; i++) {
        if (String(state.suggestions[i].title).toLowerCase() === typed) {
          hit = state.suggestions[i];
          break;
        }
      }
      if (!hit) return;

      form.notes.value = hit.notes || '';
      form.category.value = hit.category || '';
      form.recurrence.value = hit.recurrence || '';

      var p = Number(hit.points) || 0;
      form.points.value = p;

      // Reflect the filled-in value on the chips, choosing Custom when the
      // suggestion's points are not one of the presets.
      var preset = state.pointPresets.indexOf(p) >= 0 || p === 0;
      chips.querySelectorAll('.chip-pick').forEach(function (x) {
        var on = preset ? Number(x.dataset.points) === p
                        : x.dataset.points === 'custom';
        x.classList.toggle('on', on);
      });
      custom.hidden = preset;
      if (!preset) custom.value = p;

      if (hint) hint.textContent = 'Filled in from “' + hit.title +
                                   '”. Change anything you like.';
    });
  }

        '<label class="field"><span>PIN <small>(optional, ' + len +

  /**
   * One group: a name and a set of people.
   *
   * Deleting is deliberately awkward when something is using the group. An
   * item whose group has gone hands out to nobody, and a chore that silently
   * stops happening is a worse outcome than a confirmation box.
   */
  function groupForm(g, data) {
    var picked = {};
    ((g && g.memberIds) || []).forEach(function (id) { picked[String(id)] = true; });

    openModal(g ? 'Edit ' + esc(g.name) : 'New group',
      '<form class="form" id="group-form">' +
        '<label class="field"><span>Group name</span>' +
          '<input name="name" maxlength="40" placeholder="The Kids" value="' +
            esc(g ? g.name : '') + '" /></label>' +
        '<div class="field" id="group-who">' +
          '<span>Who is in it</span>' +
          '<div class="chips">' +
            data.members.map(function (m) {
              return '<button type="button" class="chip-pick' +
                (picked[String(m.memberId)] ? ' on' : '') +
                '" data-who="' + esc(m.memberId) + '">' + esc(m.name) +
                '</button>';
            }).join('') +
          '</div>' +
          '<small>Both daily lists can aim a chore at this group, and the ' +
          'Trough shares its chores out inside it.</small>' +
        '</div>' +
      '</form>',

          { label: 'Save', kind: 'btn-primary', act: function (btn) {

              busy(btn, true);
              var action = g ? 'updateGroup' : 'addGroup';
              api(action, {
                groupId: g ? g.groupId : '',
                name: f.name.value,

              }).then(function (res) {

  function removeGroupFlow(g, force) {
    api('removeGroup', { groupId: g.groupId, force: !!force })
      .then(function (res) {
        renderAccounts(res);
        toast('Group deleted.', 'good');

      .catch(function (err) {
        // The server refuses while chores still point at it, and says how

        confirmModal('Delete ' + g.name + '?', err.message, 'Delete anyway',
