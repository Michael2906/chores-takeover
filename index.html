<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/base.css" />
    <link rel="stylesheet" href="./CSS/utilities.css" />
    <link rel="stylesheet" href="./CSS/styles.css" />
    <link rel="stylesheet" href="./CSS/hover.css" />
    <link rel="stylesheet" href="./CSS/responsive.css" />
    <title>Chore Boar</title>
  </head>
  <body>
    <header id="header">
      <img src="./images/chore_boar_logo.png" alt="Chore Boar Logo" id="logo" />
      <div id="account-info"></div>
    </header>
    <div id="tabs">
      <div id="community-pool" class="tab active">Community Pool</div>
      <div id="my-chores" class="tab">My Chores</div>
      <div id="in-progress" class="tab">In Progress</div>
      <div id="ready-for-approval" class="tab">Ready for Approval</div>
      <div id="done" class="tab">Done</div>

      <div id="search">
        <input id="search-box" type="text" />
        <div id="search-button">></div>
      </div>
    </div>
    <div id="content-field"></div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
